elquun": {"role": "non officiel", "authority": "Notes personnelles, auteur inconnu. Aucun poids."}, "Plan_NOVA_preliminaire_juin": {"role": "historique", "authority": "Plan préliminaire de juin, avant la charte. Dépassé."}}, "questions": [{"id": "Q01", "question": "Quelle est la date de mise en production actuellement approuvée, et avec quelle réserve?", "answer": "Le 22 octobre 2026. Le comité de direction l'a approuvée le 10 septembre 2026. La réserve : cette date dépend de trois validations fixées par le comité du 26 septembre. 1) La sécurité accepte SEC-210. 2) Le ticket ACC-303 est fermé. 3) Le runbook est approuvé, avec la procédure de retour arrière. Tant que ce n'est pas fait, le 22 n'est pas un « go garanti ».", "nuance": ["Au 30 septembre, aucune des trois conditions n'est remplie. SEC-210 est EN VALIDATION (re-test prévu, sans date). ACC-303 est OUVERT (correctif promis pour la « prochaine build »). OPS-601 est OUVERT (le 29 septembre, Olivier n'avait toujours pas reçu la version finale du runbook).", "Le plan projet v3 du 12 septembre affiche encore le 15 octobre (cellules E7 et F7, note « Cible de planification »). Il est périmé : il n'a pas intégré la décision du 10 septembre. Nicolas l'a dit sur Teams le 15 septembre, et la note de transition demande de corriger tous les plans.", "La charte v1 et le plan v2 (15 octobre) sont des documents anciens. La charte dit elle-même qu'elle n'est pas mise à jour après les décisions de comité."], "evidence": [{"src": "M04_Transcript_Comite_direction_10sept", "loc": "lignes 17 à 23 (15:22 à 15:25)", "lines": [17, 23], "quote": "La date cible de mise en production NOVA est déplacée du 15 octobre au **22 octobre 2026**. […] Donc **approuvé**. Le 22 devient la date officielle.", "note": "La décision et son approbation (c'est le comité de direction qui décide)."}, {"src": "M06_Transcript_Comite_26sept", "loc": "lignes 11 à 16 (10:09 à 10:15)", "lines": [11, 16], "quote": "Donc trois conditions concrètes : validation sécurité de SEC-210, fermeture de ACC-303 et approbation du runbook incluant rollback. […] c'est conditionnel à ces trois éléments.", "note": "La réserve : les trois conditions de go-live."}, {"src": "E09_Rappel_mise_en_production", "loc": "courriel du 27 sept. 17:02, lignes 9 à 13", "lines": [9, 13], "quote": "la cible approuvée demeure le 22 octobre. Cette date est toutefois conditionnelle aux validations restantes […] ne pas communiquer le 22 comme un go garanti", "note": "Confirmation écrite du chargé de projet (autre source que le comité)."}, {"src": "M04_Transcript_Comite_direction_10sept", "loc": "ligne 24 (15:27)", "lines": [24, 24], "quote": "le 22 n'est pas un go automatique. Les critères de sécurité, accessibilité et exploitation restent.", "note": "La réserve existait déjà le jour de l'approbation."}, {"src": "Plan_Projet_NOVA_v3_12sept", "loc": "feuille « Plan projet », cellules E7 et F7 = 2026-10-15, G7 = « Cible de planification »", "lines": [8, 8], "quote": "A7=P-06 | B7=Mise en production | … | E7=2026-10-15 | F7=2026-10-15 | G7=Cible de planification", "note": "CONTRADICTION : plan périmé (voir C-01)."}, {"src": "Teams_15sept_ProjetNOVA", "loc": "ligne 5 (09:18)", "lines": [5, 5], "quote": "le comité a approuvé le 22 octobre le 10 septembre. Le plan projet n'a visiblement pas encore été corrigé.", "note": "Explique pourquoi le plan v3 est faux."}], "cross": "Transcriptions des comités (M04, M06), courriel du chargé de projet (E09) et clavardage Teams. Le plan v3 est écarté : le comité a plus de poids, et la décision est plus récente que le contenu du plan.", "uncertainty": "Aucune date de go/no-go n'est documentée. On ne connaît pas non plus la date du re-test SEC-210, de la « prochaine build » (ACC-303) ni de la livraison du runbook final."}, {"id": "Q02", "question": "Pourquoi la date a-t-elle changé, et quel est l'état actuel de la cause initiale?", "answer": "La date a changé à cause du connecteur interne (ticket INT-101). En septembre, les recherches renvoyaient des erreurs 401 : le jeton de service avait expiré après un changement de secret, puis il restait des erreurs par moments. Boréal a perdu plus de temps que prévu et a recommandé le 22 octobre pour stabiliser le connecteur, refaire les tests intégrés et garder une marge pour les anomalies bloquantes. La sécurité et l'accessibilité préféraient aussi ne pas raccourcir leurs tests. Aujourd'hui, cette cause est RÉGLÉE : correctif déployé le 17 septembre (rotation du secret et correction du renouvellement du jeton), 120 recherches sur 120 réussies, ticket fermé et validé par Marc Gervais le 17 septembre. Les logs montrent une réponse 200 OK ce jour-là.", "nuance": ["Le problème est réglé, mais la date n'est pas revenue au 15 octobre. Le 22 octobre reste la cible approuvée (suivi du 18 sept., comité du 26 sept., courriel E09 du 27 sept.). Elle dépend maintenant de trois autres sujets : sécurité, accessibilité, exploitation.", "Le registre de risques du 29 septembre affiche encore R-01 « Retard du connecteur interne » comme « Ouvert », avec le commentaire « Suivi au 9 septembre 2026 ». Cette ligne est périmée : le ticket, le courriel E12 et le suivi du 18 septembre disent le contraire (voir C-02).", "Les tickets DATA-401 (doublons, fermé le 9 sept.) et PERF-501 (lenteur, fermé le 7 sept.) ne sont pas la cause du report. Camille a confirmé le 10 sept. que la migration ne bloquait pas le 15."], "evidence": [{"src": "E05_Retard_integration", "loc": "courriel du 8 sept. 11:16, lignes 9 à 13", "lines": [9, 13], "quote": "Le problème du connecteur interne nous a fait perdre davantage de temps que prévu. […] très peu de marge pour la stabilisation. Notre recommandation est de déplacer la mise en production au **22 octobre**.", "note": "La cause et la proposition."}, {"src": "M04_Transcript_Comite_direction_10sept", "loc": "lignes 6 à 10 (15:02 à 15:08)", "lines": [6, 10], "quote": "Stabilisation du connecteur, reprise des tests intégrés et une marge pour corriger les anomalies bloquantes. […] Je confirme que le connecteur est le chemin critique en ce moment.", "note": "Les raisons retenues par le comité."}, {"src": "INT-101", "loc": "commentaires des 5, 8 et 17 sept. (lignes 14 à 20)", "lines": [14, 20], "quote": "On voit des 401 sur l'appel vers le service interne. Le jeton de service semble expiré […] 17 sept 14:23 - Boréal : Correctif déployé. 120 recherches rejouées, 120 réponses valides. 17 sept 16:10 - Marc : Validé côté intégration. Je ferme.", "note": "Le problème et sa fermeture."}, {"src": "E12_Resolution_integration", "loc": "courriel du 17 sept. 16:22, lignes 9 à 11", "lines": [9, 11], "quote": "120/120 recherches ont retourné les résultats attendus. INT-101 est fermé. Le problème d'intégration qui avait déclenché le risque d'échéancier est considéré résolu.", "note": "Confirmation côté client (autre source que le ticket)."}, {"src": "INT-101_extrait_logs", "loc": "lignes 1 à 3", "lines": [1, 3], "quote": "2026-09-05T11:15:03Z … -> 401 Unauthorized … exp=2026-09-04T23:00:00Z … 2026-09-17T14:20:11Z … -> 200 OK 187ms", "note": "Preuve technique avant et après."}, {"src": "M05_CR_Suivi_18sept", "loc": "ligne 6", "lines": [6, 6], "quote": "INT-101 : le connecteur interne a été validé et fermé le 17 septembre.", "note": "État d'ensemble au 18 sept."}, {"src": "Registre_Risques_29sept", "loc": "feuille « Risques », ligne R-01 : F2 = « Ouvert », H2 = « Suivi au 9 septembre 2026 »", "lines": [3, 3], "quote": "A2=R-01 | B2=Retard du connecteur interne | … | F2=Ouvert | … | H2=Suivi au 9 septembre 2026", "note": "CONTRADICTION : registre périmé sur R-01 (voir C-02)."}], "cross": "Courriel du fournisseur (E05), transcription du comité (M04), ticket INT-101, courriel de validation client (E12) et logs. Le registre de risques (R-01) est écarté parce que les faits qu'il décrit sont plus anciens.", "uncertainty": "Le registre du 29 septembre n'a pas été corrigé sur R-01. Personne n'a décidé de revenir au 15 octobre."}, {"id": "Q03", "question": "Qui a approuvé le changement et quand? Distinguez proposition et approbation.", "answer": "La PROPOSITION vient de Julien Moreau (Boréal Numérique), par courriel le 8 septembre 2026 à 11:16. Il précise lui-même que c'est une proposition du fournisseur et que la décision revient au client. Il la répète au comité le 10 septembre à 15:02. L'APPROBATION vient du comité de direction NOVA, le 10 septembre 2026 entre 15:22 et 15:25. Élodie Caron (alors chargée de projet) formule la décision. Personne ne s'oppose : Sophie Lambert, Marc Gervais et Olivier Côté disent « Non » à la question « quelqu'un s'oppose? », Nicolas Perron dit « D'accord ». Élodie conclut : « approuvé », le 22 octobre devient la date officielle.", "nuance": ["La proposition vient du fournisseur, l'approbation vient du client. Il ne faut pas dire que Boréal a approuvé.", "Les rappels qui suivent ne sont pas l'approbation, seulement des confirmations : Teams du 15 sept. (Nicolas), note de transition du 16 sept., suivi du 18 sept., comité du 26 sept., courriel E09 du 27 sept.", "Le comité du 26 septembre n'a pas ré-approuvé la date. Il a précisé les conditions de go-live. Nicolas y annonce un compte rendu, mais ce compte rendu n'est pas dans le dossier (on a seulement la transcription)."], "evidence": [{"src": "E05_Retard_integration", "loc": "courriel du 8 sept. 11:16, ligne 13", "lines": [11, 13], "quote": "À ce stade, il s'agit d'une proposition de notre part. À vous de confirmer la décision de gouvernance.", "note": "La proposition (fournisseur)."}, {"src": "M04_Transcript_Comite_direction_10sept", "loc": "ligne 6 (15:02)", "lines": [6, 6], "quote": "Comme écrit mardi […] Notre recommandation est de déplacer le lancement du 15 au 22 octobre.", "note": "Proposition répétée en comité."}, {"src": "M04_Transcript_Comite_direction_10sept", "loc": "lignes 17 à 23 (15:22 à 15:25)", "lines": [17, 23], "quote": "Je vais formuler la décision. […] Est-ce que quelqu'un s'oppose? [silence] Sophie : Non. Marc : Non. Olivier : Non. Nicolas : D'accord. Élodie : Donc **approuvé**.", "note": "L'approbation (comité de direction, 10 sept. 15:25)."}, {"src": "Teams_15sept_ProjetNOVA", "loc": "ligne 5 (09:18)", "lines": [5, 5], "quote": "le comité a approuvé le 22 octobre le 10 septembre.", "note": "Autre source qui confirme la date d'approbation."}, {"src": "Note_transition_Elodie_16sept", "loc": "ligne 7", "lines": [7, 7], "quote": "faire mettre à jour la date dans tous les plans (le comité a approuvé le 22 octobre)", "note": "Confirmation par la chargée sortante."}], "cross": "Courriel du fournisseur (E05), transcription du comité (M04), Teams du 15 sept. et note de transition.", "uncertainty": "Il n'y a pas de compte rendu officiel du comité du 10 septembre dans le dossier. La transcription en tient lieu."}, {"id": "Q04", "question": "Qui est responsable du projet et depuis quand?", "answer": "Nicolas Perron est chargé de projet NOVA depuis le 16 septembre 2026. Élodie Caron l'a annoncé par courriel ce jour-là à 8 h 35, et sa note de transition et un rappel Teams (8 h 45) le confirment. Avant lui, Élodie Caron a été chargée de projet du 7 juillet (charte v1, compte rendu de démarrage, courriel E01) au 15 septembre 2026.", "nuance": ["La charte v1 nomme encore Élodie. C'est normal : elle n'est pas mise à jour après les décisions (elle le dit à la ligne 20). Le plan v2 donne aussi la mise en production (P-06) à Élodie.", "Le plan v3, daté du 12 septembre, donne déjà P-06 à Nicolas Perron (cellule D7), soit quatre jours avant l'annonce. La transition était « comme convenu » (E06), mais la date officielle reste le 16 septembre.", "Élodie reste disponible « quelques jours » pour le transfert. Nicolas reprend aussi le comité du vendredi (Teams 16 sept., 8 h 47)."], "evidence": [{"src": "E06_Transition_charge_projet", "loc": "courriel du 16 sept. 08:35, ligne 9", "lines": [9, 11], "quote": "Comme convenu, Nicolas Perron prend officiellement la charge du projet NOVA à compter d'aujourd'hui, 16 septembre.", "note": "L'annonce officielle."}, {"src": "Note_transition_Elodie_16sept", "loc": "ligne 4", "lines": [4, 4], "quote": "À compter d'aujourd'hui, Nicolas Perron reprend le rôle de chargé de projet NOVA.", "note": "Document de transition (autre source)."}, {"src": "Teams_16sept_Transition", "loc": "lignes 4 et 5 (08:45, 08:47)", "lines": [4, 5], "quote": "à partir d'aujourd'hui, Nicolas reprend officiellement NOVA. […] Je reprends aussi le comité du vendredi.", "note": "Troisième source."}, {"src": "Charte_Projet_NOVA_v1", "loc": "lignes 4 et 20", "lines": [4, 4], "quote": "Chargée de projet : Élodie Caron […] Cette charte […] n'est pas mise à jour automatiquement après chaque décision de comité.", "note": "Responsable de départ (7 juillet). Document non mis à jour."}, {"src": "Plan_Projet_NOVA_v3_12sept", "loc": "cellule D7 = « Nicolas Perron » (plan daté du 12 sept.)", "lines": [8, 8], "quote": "A7=P-06 | B7=Mise en production | … | D7=Nicolas Perron", "note": "Petit écart de date (12 contre 16 sept.)."}], "cross": "Courriel (E06), note de transition et Teams. La charte et le plan v2 sont anciens.", "uncertainty": "On ne sait pas à quelle date la transition a été « convenue ». Le plan v3 du 12 sept. l'anticipe."}, {"id": "Q05", "question": "Quel est le montant contractuel autorisé et comment se calcule-t-il?", "answer": "204 000 $ CAD, hors taxes. Calcul : 180 000 $ (montant maximal initial du contrat avec Boréal, période du 7 juillet au 31 octobre 2026; même chiffre dans la charte et le compte rendu de démarrage) + 24 000 $ (demande de changement CR-01 « rapports avancés », APPROUVÉE par le comité de projet le 14 août 2026). CR-04 (18 000 $, optimisation mobile) est un BROUILLON sans approbation : il ne compte pas.", "nuance": ["Où en est-on au 30 sept. : facturé 186 000 $ (INV-001 60 000 $ payée, INV-002 72 000 $ payée, INV-003 54 000 $ en validation). Payé : 132 000 $. Sur ces 186 000 $, 18 000 $ (la ligne CR-04 de INV-003) ne sont pas autorisés.", "Facturation valable (sans la ligne CR-04) : 168 000 $. Il reste donc 36 000 $ sous le plafond de 204 000 $. Si INV-003 était payée telle quelle, 186 000 $ resteraient sous 204 000 $. C'est sans doute ce que veut dire le « Budget VERT, sous le plafond contractuel » du rapport du 21 sept. Mais ce vert cache une ligne non autorisée.", "INV-778 (41 000 $, projet ORION, 20 sept.) concerne un autre projet. Elle ne compte pas dans NOVA.", "Le contrat demande une demande de changement écrite et approuvée avant tout travail hors portée, et avant de le facturer."], "evidence": [{"src": "CONTRAT_Boreal_NOVA", "loc": "page 1, tableau « Valeur contractuelle », ligne « Montant maximal initial » = 180 000 $; ligne « Période »", "lines": [9, 16], "quote": "Montant maximal initial 180 000 $ … Devise CAD … Période 7 juillet au 31 octobre 2026", "note": "La base du contrat."}, {"src": "CR-01_Rapports_avances_APPROUVE", "loc": "page 1, tableau « Impact financier » : Montant 24 000 $, Décision APPROUVÉE, Date 14 août 2026, Autorité Comité de projet", "lines": [5, 12], "quote": "Montant 24 000 $ / Décision APPROUVÉE / Date de décision 14 août 2026 / Autorité Comité de projet", "note": "Changement approuvé : il s'ajoute."}, {"src": "CR-04_Optimisation_mobile_BROUILLON", "loc": "page 1, « Statut : BROUILLON - APPROBATION REQUISE »; note : aucun numéro d'approbation ni signature", "lines": [6, 15], "quote": "Montant estimé 18 000 $ / Statut BROUILLON - APPROBATION REQUISE […] Aucun numéro d'approbation ni signature de comité n'est présent", "note": "Ne s'ajoute PAS."}, {"src": "Charte_Projet_NOVA_v1", "loc": "ligne 6", "lines": [6, 6], "quote": "Budget initial : 180 000 $ CAD", "note": "Deuxième source pour le 180 000 $."}, {"src": "CONTRAT_Boreal_NOVA", "loc": "page 1, section « Gestion des changements »", "lines": [22, 24], "quote": "Tout travail hors portée doit faire l'objet d'une demande de changement écrite et approuvée avant exécution et facturation.", "note": "La règle : seuls les changements approuvés s'ajoutent."}, {"src": "INV-002", "loc": "page 1, ligne « Rapports avancés - CR-01 » 24 000 $, Statut Payée", "lines": [14, 23], "quote": "Statut Payée … Développement phase 1 - jalon 2 48 000 $ … Rapports avancés - CR-01 24 000 $ … TOTAL 72 000 $", "note": "CR-01 déjà facturé et payé."}], "cross": "Contrat, CR-01, charte et factures. CR-04 est écarté à cause de son statut de brouillon.", "uncertainty": "Le rapport de statut ne dit pas quel plafond il utilise (180 000 $ ou 204 000 $). Aucun bon de commande n'est documenté, seulement des factures."}, {"id": "Q06", "question": "Quel problème présente INV-003? Précisez le montant concerné et le traitement à prévoir.", "answer": "INV-003 (facture Boréal du 22 septembre 2026, total 54 000 $, statut « En validation ») contient une ligne « Optimisation interface mobile - CR-04 » de 18 000 $. Or CR-04 est un brouillon qui n'a jamais été approuvé (aucun numéro d'approbation, aucune signature). Le comité du 10 septembre n'a pris « aucune décision de dépense ». Le 24 septembre, Nicolas Perron a écrit que CR-04 est reporté en phase 2 et qu'aucune dépense liée ne doit être engagée ni facturée. Le contrat interdit de facturer un travail hors portée sans demande de changement écrite et approuvée. Montant concerné : 18 000 $. L'autre ligne, « Développement phase 1 - jalon 3 » (36 000 $), fait partie de la portée. Traitement à prévoir : ne pas payer les 18 000 $; contester la ligne auprès de Boréal et demander une facture corrigée (ou une note de crédit) qui ramène INV-003 à 36 000 $; répondre à Amélie Fortin (Finances), qui retient la facture; payer le jalon 3 seulement quand sa livraison est confirmée.", "nuance": ["Ce qui est documenté : « Aucune dépense liée à CR-04 ne doit être engagée ou facturée » (E10, décision de portée). Ce qui n'est pas documenté : la façon de régulariser (facture corrigée ou paiement partiel). C'est une RECOMMANDATION de notre équipe, à confirmer par Nicolas et Finances.", "Boréal avait été prévenu avant même la facture. Nicolas a rappelé sur Teams le 22 sept. que le package CR-04 à 18 k n'est pas approuvé. Au comité du 26 sept. : « Regarder, oui. Facturer du CR-04, non. »", "Le dossier ne contient pas de réponse de Nicolas à Amélie (E07), ni de preuve que le jalon 3 est livré. À vérifier avant de payer."], "evidence": [{"src": "INV-003", "loc": "page 1 : Date 2026-09-22, Statut « En validation », ligne « Optimisation interface mobile - CR-04 » 18 000 $, TOTAL 54 000 $", "lines": [12, 26], "quote": "Statut En validation … Développement phase 1 - jalon 3 36 000 $ … Optimisation interface mobile - CR-04 18 000 $ … TOTAL 54 000 $ … La référence CR-04 apparaît sur la ligne mobile.", "note": "La facture elle-même."}, {"src": "E07_Facture_003_question", "loc": "courriel du 23 sept. 10:18, lignes 9 à 11", "lines": [9, 11], "quote": "Il y a une ligne de 18 000 $ « Optimisation interface mobile - CR-04 ». Peux-tu me transmettre l'approbation correspondante? Je trouve un brouillon de CR-04, mais rien qui indique qu'il a été approuvé.", "note": "Finances retient la facture. La pièce jointe est le même fichier INV-003.pdf : ce n'est pas une deuxième preuve."}, {"src": "CR-04_Optimisation_mobile_BROUILLON", "loc": "page 1, Statut « BROUILLON - APPROBATION REQUISE »; note finale", "lines": [6, 15], "quote": "Statut BROUILLON - APPROBATION REQUISE […] Aucun numéro d'approbation ni signature de comité n'est présent dans ce document.", "note": "Pas d'approbation."}, {"src": "E10_Fonction_mobile", "loc": "courriel du 24 sept. 13:42, lignes 9 à 11", "lines": [9, 11], "quote": "les optimisations mobiles avancées proposées dans CR-04 ne font pas partie de la phase 1 approuvée. Nous les reportons à la phase 2. Aucune dépense liée à CR-04 ne doit être engagée ou facturée sans nouvelle approbation.", "note": "Position officielle du chargé de projet, envoyée à Boréal et à Finances."}, {"src": "CONTRAT_Boreal_NOVA", "loc": "page 1, section « Gestion des changements »", "lines": [22, 24], "quote": "Tout travail hors portée doit faire l'objet d'une demande de changement écrite et approuvée avant exécution et facturation.", "note": "La règle du contrat qui justifie le refus."}, {"src": "M04_Transcript_Comite_direction_10sept", "loc": "lignes 30 à 35 (15:34 à 15:40)", "lines": [30, 35], "quote": "autour de 18 000 $ […] Pas selon la portée actuelle. On va traiter ça séparément, aucune approbation aujourd'hui. […] Mobile : aucune décision de dépense.", "note": "Le comité n'a rien approuvé."}, {"src": "M06_Transcript_Comite_26sept", "loc": "lignes 22 à 24 (10:24 à 10:27)", "lines": [22, 24], "quote": "Regarder, oui. Facturer du CR-04, non. Il n'est pas approuvé.", "note": "Rappel au fournisseur après la facture."}], "cross": "Facture, courriel de Finances, CR-04 (brouillon), courriel E10, contrat et transcriptions (M04, M06).", "uncertainty": "Pas de trace d'une note de crédit, d'une facture corrigée ni d'une réponse écrite à Finances. Livraison du jalon 3 non documentée."}, {"id": "Q07", "question": "Où les données de production doivent-elles être hébergées? Quelle preuve confirme la mise en œuvre?", "answer": "Au Canada, dans la région Canada Central. La décision a été prise en atelier d'architecture le 23 juillet 2026 (Élodie, Marc, Sophie et Julien d'accord), à la demande de la sécurité (Sophie Lambert). Elle est formalisée dans l'ADR-007 (statut « Acceptée »). L'architecture v1 (East US, 18 juillet) est remplacée sur ce point. Preuves que c'est fait : 1) courriel de Boréal du 26 août 9 h 05 : « migration des ressources […] vers Canada Central est complétée », test de déploiement et de connectivité la veille sans blocage, schéma v2 joint; 2) schéma Architecture_NOVA_v2 (25 août, « Version révisée après ADR-007 », Données : Canada Central); 3) comité du 27 août : migration « déclarée terminée par Boréal et vérifiée par l'équipe architecture »; 4) plan projet : activité P-02 Architecture « Terminé », note « Migration Canada requise ».", "nuance": ["La pièce jointe de E03 est le même fichier que 06_Architecture_et_decisions/Architecture_NOVA_v2.pdf (même empreinte). Il ne faut pas la compter deux fois. La vraie confirmation indépendante, c'est le comité du 27 août (vérification côté client).", "L'ADR-007 demandait une validation technique avant les tests de production. Le compte rendu du 27 août en tient lieu (« vérifiée par l'équipe architecture »). Il n'y a pas de rapport de validation détaillé dans le dossier.", "Le schéma v2 est un dessin simplifié. Il ne liste pas les ressources migrées."], "evidence": [{"src": "ADR-007_Localisation_donnees", "loc": "lignes 3, 4, 9 et 10 (Décision)", "lines": [9, 10], "quote": "L'environnement de production de NOVA sera déployé dans **Canada Central**. L'architecture v1 doit être considérée comme remplacée sur ce point.", "note": "La décision formelle (acceptée le 23 juillet)."}, {"src": "M02_Transcript_Architecture_23juillet", "loc": "lignes 11 à 17 (09:06 à 09:12)", "lines": [11, 17], "quote": "Les données de production NOVA doivent demeurer au Canada. […] Donc on tranche Canada Central? Marc : Oui. Sophie : Oui. Julien : Oui de notre côté. […] La v1 devient donc obsolète pour la localisation des données.", "note": "D'où vient l'exigence, et l'accord de tous."}, {"src": "E03_Confirmation_Canada_Central", "loc": "courriel du 26 août 09:05, lignes 9 à 11", "lines": [9, 11], "quote": "La migration des ressources prévues pour NOVA vers Canada Central est complétée. […] test de déploiement et de connectivité hier soir. Aucun blocage identifié.", "note": "Le fournisseur dit que c'est fait."}, {"src": "M03_CR_Comite_27aout", "loc": "ligne 5", "lines": [5, 5], "quote": "La migration de l'architecture vers Canada Central est déclarée terminée par Boréal et vérifiée par l'équipe architecture.", "note": "Vérification côté client (autre source)."}, {"src": "Architecture_NOVA_v2", "loc": "page 1 : titre « v2 - 25 août 2026 », « Version révisée après ADR-007 », bloc « Données / Canada Central »", "lines": [1, 7], "quote": "Architecture NOVA - v2 - 25 août 2026 / Version révisée après ADR-007. … Données Canada Central", "note": "Le schéma en vigueur."}, {"src": "Plan_Projet_NOVA_v3_12sept", "loc": "ligne P-02 : C3 = « Terminé », G3 = « Migration Canada requise »", "lines": [4, 4], "quote": "A3=P-02 | B3=Architecture | C3=Terminé | … | G3=Migration Canada requise", "note": "Cohérent avec la migration terminée."}, {"src": "Architecture_NOVA_v1", "loc": "page 1 : « v1 - 18 juillet 2026 », bloc « Données / East US »", "lines": [1, 7], "quote": "Version initiale préparée avant la décision de localisation des données. … Données East US", "note": "Version dépassée (pour le contexte)."}], "cross": "ADR, transcription de l'atelier, courriel du fournisseur, compte rendu de comité, schéma v2 et plan.", "uncertainty": "Pas de rapport de validation technique détaillé. La liste exacte des ressources migrées n'est pas documentée."}, {"id": "Q08", "question": "La sécurité est-elle acceptée? Distinguez livraison et validation.", "answer": "Non. LIVRAISON : Boréal a déployé un correctif pour SEC-210 (la journalisation des exports CSV administrateur est incomplète : la ligne EXPORT_CSV existe, mais sans objet ni résultat) sur l'environnement de validation le 19 septembre. Ses tests automatisés passent. VALIDATION : c'est Sophie Lambert qui accepte, et elle ne l'a pas fait. Le 19 sept. : « “déployé” != “accepté” ». Au comité du 26 sept. : « Nous n'avons pas encore donné l'acceptation sécurité de SEC-210 ». Re-test prévu, statut gardé EN VALIDATION le 26 septembre à 15 h 40. Le ticket est « Bloquante avant production ». Cette validation est la condition de go-live numéro 1. Le risque R-02 « Validation sécurité incomplète » est ouvert, avec une probabilité élevée.", "nuance": ["Le rapport de statut du 21 septembre dit « Sécurité VERT, Correctif SEC-210 livré ». Il confond livraison et acceptation (et il admet avoir été écrit avant la vérification des tickets). Le brouillon d'Alex (« la sécurité […] complétée ») reprend cette erreur. À corriger (voir C-03).", "Le défaut n'est pas une absence totale de journal : la connexion, la consultation et la déconnexion sont bien tracées. C'est l'événement d'export qui est incomplet (capture SEC-210_audit : objet « --- », résultat « --- »).", "Sophie avait demandé dès le 23 juillet de journaliser les actions administrateur, « surtout consultation et export ». Le 27 août, elle a rappelé qu'il faudrait le vérifier en situation réelle."], "evidence": [{"src": "SEC-210", "loc": "en-tête (Priorité « Bloquante avant production », Statut « EN VALIDATION ») et commentaires du 19 sept. 10:22, 19 sept. 14:05, 26 sept. 15:40 (lignes 23 à 25)", "lines": [23, 25], "quote": "Boréal : Fix déployé sur l'environnement de validation. Pour nous c'est réglé. / Sophie : […] Ne pas fermer avant validation sécurité. / Sophie : Re-test planifié. Statut maintenu EN VALIDATION.", "note": "Livraison et validation, dans le ticket."}, {"src": "SEC-210", "loc": "lignes 17 et 18 (Attendu / Observé)", "lines": [17, 18], "quote": "Observé : une ligne EXPORT_CSV existe avec utilisateur et horodatage, mais l'objet (identifiant du dossier) et le résultat sont absents. […] Le défaut est une journalisation d'export incomplète, pas l'absence totale d'une ligne d'export.", "note": "Le défaut exact."}, {"src": "SEC-210_audit", "loc": "capture, tableau du journal, ligne 14:04:08 EXPORT_CSV : Objet « --- », Résultat « --- »; encadré « Observation QA »", "lines": [6, 8], "quote": "14:04:08 | np.admin | EXPORT_CSV | --- | ---", "note": "Preuve visuelle du défaut."}, {"src": "E08_Correctif_journalisation", "loc": "courriel du 19 sept. 10:20, lignes 9 à 11", "lines": [9, 11], "quote": "Le correctif pour SEC-210 est déployé en validation depuis ce matin. Nos tests automatisés passent et, pour nous, le problème est corrigé. Sophie, tu peux faire ton re-test", "note": "La livraison (fournisseur)."}, {"src": "Teams_19sept_Securite", "loc": "ligne 5 (10:31)", "lines": [4, 6], "quote": "On garde le ticket en validation jusqu'à notre re-test. « déployé » != « accepté » :)", "note": "La position de la sécurité (autre source)."}, {"src": "M06_Transcript_Comite_26sept", "loc": "lignes 6 à 8 (10:01 à 10:03) et 11 (10:09)", "lines": [6, 11], "quote": "Vous avez livré un fix. Nous n'avons pas encore donné l'acceptation sécurité de SEC-210.", "note": "État au dernier comité. Condition de go-live numéro 1."}, {"src": "Rapport_Statut_21sept", "loc": "page 1, tableau Synthèse, ligne « Sécurité, VERT, Correctif SEC-210 livré »; « Commentaire de gestion »", "lines": [10, 18], "quote": "Sécurité VERT Correctif SEC-210 livré […] Le rapport a été préparé avant la dernière vérification détaillée de certains tickets.", "note": "CONTRADICTION (C-03) : livré n'est pas accepté."}, {"src": "Registre_Risques_29sept", "loc": "ligne R-02 : F3 = « Ouvert », C3 = « Élevée », G3 = « Re-test de SEC-210 avant go-live »", "lines": [4, 4], "quote": "A3=R-02 | B3=Validation sécurité incomplète | C3=Élevée | D3=Élevé | E3=Sophie Lambert | F3=Ouvert", "note": "Le registre est cohérent avec le ticket."}], "cross": "Ticket, capture, courriel du fournisseur, Teams sécurité, transcription du comité et registre. Le rapport de statut est écarté : c'est la sécurité qui décide, et les sources plus récentes le contredisent.", "uncertainty": "Date du re-test de Sophie inconnue (« planifié »). Résultat inconnu au 30 septembre."}, {"id": "Q09", "question": "L'accessibilité est-elle complétée? Identifiez ce qui reste à corriger.", "answer": "Non. Deux anomalies sont corrigées et validées par Mélissa Gagnon : ACC-301 (champ sans étiquette, le lecteur d'écran dit « edit blank »), fermé le 15 août après validation avec NVDA et VoiceOver; ACC-302 (contraste 2,1:1 du texte de statut), fermé le 20 août après un re-test à 5,3:1. Il reste ACC-303 (créé le 17 septembre, priorité Haute, OUVERT) : dans la fenêtre « Modifier le dossier », le focus clavier tourne entre les champs Nom et Commentaire, et la touche Tab n'atteint jamais le bouton « Enregistrer » (reproduit sur Chrome et Edge). Boréal l'a reproduit le 18 sept. : le composant de fenêtre retient le focus avec une liste d'éléments incomplète. Au 26 septembre : « Toujours ouvert. Correctif annoncé pour la prochaine build. » Mélissa le juge bloquant avant la production. Sa fermeture est la condition de go-live numéro 2 (risque R-04 ouvert).", "nuance": ["Le courriel de Boréal du 20 août (« Tout devrait maintenant être conforme ») ne parlait que des étiquettes et du contraste. Mélissa avait annoncé dès le 12 août un deuxième passage clavier sur les fenêtres (rappelé au comité du 27 août et au suivi du 18 sept.). Une correction annoncée par le fournisseur n'est pas une validation QA.", "Le rapport de statut du 21 septembre (« Accessibilité VERT, Correctifs appliqués ») est contredit par ACC-303, ouvert depuis le 17 septembre. Le brouillon d'Alex (« accessibilité complétée ») doit être corrigé (voir C-04).", "Les captures ACC-301_labels et ACC-302_contraste sont anciennes : elles ne prouvent pas que ces défauts sont encore là (ils sont fermés). La capture ACC-303_focus (Build 2026.09.17), elle, est confirmée par le commentaire du 26 sept."], "evidence": [{"src": "ACC-303", "loc": "en-tête (Priorité Haute, Statut OUVERT) et commentaires du 17 sept. 13:14, 18 sept. 09:50, 26 sept. 11:03 (lignes 14 à 16)", "lines": [14, 16], "quote": "le bouton Enregistrer n'est jamais atteint avec Tab. […] Le composant modal intercepte le focus avec une liste d'éléments focusables incomplète. […] 26 sept 11:03 - Mélissa : Toujours ouvert. Correctif annoncé pour la prochaine build.", "note": "Ce qui reste à corriger."}, {"src": "ACC-303_focus", "loc": "capture Build 2026.09.17, bouton « Enregistrer » encadré, note « Le focus clavier ne rejoint pas ce bouton »", "lines": [3, 4], "quote": "Le focus clavier ne rejoint pas ce bouton", "note": "Preuve visuelle."}, {"src": "M06_Transcript_Comite_26sept", "loc": "lignes 9 et 15 (10:05, 10:12)", "lines": [9, 15], "quote": "Il reste ACC-303. La modale ne permet toujours pas d'atteindre Enregistrer au clavier. Pour moi c'est un bloquant d'accessibilité avant production. […] On vise le correctif ACC-303 dans la prochaine build.", "note": "État au dernier comité (autre source que le ticket)."}, {"src": "ACC-301", "loc": "commentaire du 15 août (ligne 16)", "lines": [14, 16], "quote": "15 août - Mélissa : Validé avec NVDA et VoiceOver. Fermé.", "note": "Corrigé et validé."}, {"src": "ACC-302", "loc": "commentaires des 13, 18 et 20 août (lignes 14 à 16)", "lines": [14, 16], "quote": "J'ai mesuré 2,1:1 […] 18 août - Boréal : Palette de statut corrigée. 20 août - Mélissa : Re-test OK à 5,3:1. Fermé.", "note": "Corrigé et validé."}, {"src": "E04_Corrections_accessibilite", "loc": "courriel du 20 août 15:44, ligne 9, et citation du 12 août (ligne 16)", "lines": [9, 16], "quote": "Tout devrait maintenant être conforme de notre côté. […] > Je veux aussi repasser les modales au clavier dans une prochaine build.", "note": "L'annonce du fournisseur ne couvre que les étiquettes et le contraste. Le passage clavier était déjà annoncé."}, {"src": "M05_CR_Suivi_18sept", "loc": "ligne 10", "lines": [10, 10], "quote": "Accessibilité : ACC-301 et ACC-302 sont fermés. Un scénario de navigation clavier sur modal doit encore être vérifié.", "note": "État d'ensemble au 18 sept."}, {"src": "Rapport_Statut_21sept", "loc": "page 1, ligne « Accessibilité, VERT, Correctifs appliqués »", "lines": [12, 12], "quote": "Accessibilité VERT Correctifs appliqués", "note": "CONTRADICTION (C-04) : ACC-303 est ouvert depuis le 17 sept."}, {"src": "Registre_Risques_29sept", "loc": "ligne R-04 : F5 = « Ouvert », G5 = « Fermer ACC-303 »", "lines": [6, 6], "quote": "A5=R-04 | B5=Accessibilité | … | F5=Ouvert | G5=Fermer ACC-303", "note": "Le registre est cohérent."}], "cross": "Tickets ACC-301, 302 et 303, capture, transcription M06, suivi M05, courriel E04 et registre. Le rapport de statut est écarté : c'est la QA qui valide, et les sources plus récentes le contredisent.", "uncertainty": "Date de la « prochaine build » inconnue. Aucun autre scénario clavier en attente n'est documenté (seul ACC-303 est ouvert)."}, {"id": "Q10", "question": "Quelles sont les trois conditions de go-live? Précisez les travaux manquants du runbook à partir de sa capture.", "answer": "Les trois conditions ont été fixées au comité de direction du 26 septembre par Nicolas Perron, et confirmées par Sophie, Mélissa et Olivier : 1) la sécurité valide SEC-210 (Sophie Lambert); 2) ACC-303 est fermé (Mélissa Gagnon, correctif Boréal dans la « prochaine build »); 3) le runbook est approuvé, avec la procédure de retour arrière (rollback) (Olivier Côté). Ce qui manque au runbook, d'après la capture OPS-601_runbook (« Version du 25 septembre ») : les étapes 1 à 3 sont « OK » (vérifier la santé des services, activer le mode maintenance, déployer la version approuvée); l'étape 4 « Procédure de retour arrière » est « TODO »; l'étape 5 « Validation fonctionnelle post-déploiement » est « À compléter ». Il manque donc le retour arrière ET la validation fonctionnelle après déploiement. Olivier veut en plus une procédure qu'une autre personne peut exécuter sans appeler l'équipe projet. Le 29 septembre, il n'avait toujours pas reçu la version finale.", "nuance": ["Le ticket OPS-601 ne nomme que le rollback (« au minimum ») et renvoie à la capture pour « une autre étape à compléter » : c'est l'étape 5. Les deux doivent être livrées pour que le runbook puisse être approuvé.", "Ces conditions reprennent les « critères de sécurité, accessibilité et exploitation » posés par Nicolas dès le 10 septembre (15:27) et résumés dans E09 (27 sept.). Olivier avait demandé dès le 10 septembre un runbook final « au moins quelques jours avant » la mise en production.", "Aucune des trois conditions n'a de date limite documentée : « à confirmer » pour les trois, avant le 22 octobre."], "evidence": [{"src": "M06_Transcript_Comite_26sept", "loc": "lignes 11 à 14 (10:09 à 10:10) et 16 (10:15)", "lines": [11, 16], "quote": "Donc trois conditions concrètes : validation sécurité de SEC-210, fermeture de ACC-303 et approbation du runbook incluant rollback. Exact? Sophie : Oui. Mélissa : Oui. Olivier : Oui.", "note": "Les conditions, telles que fixées."}, {"src": "OPS-601_runbook", "loc": "capture « Version du 25 septembre », lignes 4 « Procédure de retour arrière : TODO » et 5 « Validation fonctionnelle post-déploiement : À compléter »", "lines": [6, 7], "quote": "4. Procédure de retour arrière : TODO / 5. Validation fonctionnelle post-déploiement : À compléter", "note": "Les travaux manquants (la preuve demandée)."}, {"src": "OPS-601", "loc": "commentaires des 25, 26 et 29 sept. (lignes 14 à 16)", "lines": [14, 16], "quote": "Il manque au minimum la procédure de rollback. La capture jointe identifie aussi une autre étape à compléter. J'ai besoin de quelque chose qu'une autre personne peut exécuter sans appeler l'équipe projet. […] 29 sept - Olivier : Toujours pas reçu la version finale.", "note": "L'exigence de l'exploitation et l'état au 29 sept."}, {"src": "E09_Rappel_mise_en_production", "loc": "courriel du 27 sept., ligne 11", "lines": [11, 11], "quote": "conditionnelle aux validations restantes : sécurité, accessibilité et préparation exploitation. Le comité du 26 septembre a précisé les éléments à fermer.", "note": "Confirmation écrite (autre source)."}, {"src": "M06_Transcript_Comite_26sept", "loc": "ligne 10 (10:07)", "lines": [10, 10], "quote": "Le runbook est encore incomplet. Il manque le rollback. Je ne donnerai pas mon go exploitation tant que je n'ai pas une procédure exécutable.", "note": "C'est Olivier Côté qui décide."}, {"src": "M04_Transcript_Comite_direction_10sept", "loc": "ligne 12 (15:12)", "lines": [12, 12], "quote": "je veux un runbook final au moins quelques jours avant.", "note": "Contrainte de délai (sans chiffre)."}, {"src": "Registre_Risques_29sept", "loc": "lignes R-02, R-03, R-04 (F3 à F5 = « Ouvert »)", "lines": [4, 6], "quote": "R-02 Validation sécurité incomplète … R-03 Préparation exploitation incomplète … Finaliser le runbook et le rollback … R-04 Accessibilité … Fermer ACC-303", "note": "Les trois conditions correspondent aux trois risques ouverts."}], "cross": "Transcription M06, capture du runbook, ticket OPS-601, courriel E09 et registre de risques.", "uncertainty": "Pas de date de livraison du runbook final ni de date du re-test. « Quelques jours avant » n'est pas chiffré."}], "timeline": [{"date": "2026-06", "type": "fait", "theme": "échéancier", "title": "Plan préliminaire de juin : mise en production visée le 15 octobre", "detail": "Version préliminaire (deux lignes), écrite avant la charte.", "src": "Plan_NOVA_preliminaire_juin", "lines": [4, 4], "valid": false}, {"date": "2026-07-07", "type": "décision", "theme": "gouvernance", "title": "Démarrage de NOVA : Élodie Caron chargée de projet, budget maximal 180 000 $, cible 15 octobre, portée de la phase 1", "detail": "Décisions de départ du compte rendu de démarrage. Charte v1 datée du même jour. E01 confirme à 16:10. Le mobile avancé n'est pas discuté comme livrable.", "src": "M01_CR_Demarrage_07juillet", "lines": [8, 12], "valid": false, "also": [["Charte_Projet_NOVA_v1", 4, 7], ["E01_Lancement_NOVA", 11, 11]]}, {"date": "2026-07-18", "type": "livraison", "theme": "architecture", "title": "Architecture v1 (East US) préparée par Boréal", "detail": "Basée sur la zone standard du fournisseur.", "src": "Architecture_NOVA_v1", "lines": [1, 7], "valid": false}, {"date": "2026-07-22", "type": "fait", "theme": "architecture", "title": "Sophie Lambert conteste East US et demande que les données de production restent au Canada", "detail": "Courriel 14:32, schéma v1 joint. « À trancher demain en atelier ».", "src": "E02_Question_hebergement", "lines": [9, 11], "valid": false}, {"da t.", "a": {"claim": "R-01 : Statut « Ouvert », commentaire « Suivi au 9 septembre 2026 »", "src": "Registre_Risques_29sept", "lines": [3, 3], "loc": "cellules F2 et H2"}, "b": {"claim": "« INT-101 est fermé. Le problème d'intégration qui avait déclenché le risque d'échéancier est considéré résolu. »", "src": "E12_Resolution_integration", "lines": [9, 11], "loc": "courriel du 17 sept. 16:22"}, "resolution": "Le ticket est fermé : la ligne R-01 est périmée. Date des faits : le fichier est daté du 29 sept., mais sa ligne R-01 n'a pas été revue depuis le 9 sept. (le commentaire le dit), alors que la fermeture date du 17 sept. (ticket, courriel du responsable architecture, suivi du 18 sept., logs 200 OK). Qui décide : le propriétaire du risque (Marc Gervais) est justement celui qui a validé la fermeture.", "basis": "date des faits + qui décide", "status_now": "Registre à corriger (fermer R-01). Voir l'action A-08. Une date de fichier récente ne garantit pas une information à jour.", "extra": [["INT-101", 17, 18], ["M05_CR_Suivi_18sept", 6, 6], ["INT-101_extrait_logs", 3, 3]]}, {"id": "C-03", "theme": "sécurité", "in_plan_or_register": false, "title": "Sécurité « VERT, correctif livré » (rapport du 21 sept.) et « complétée » (brouillon d'Alex), contre SEC-210 EN VALIDATION, acceptation non donnée", "a": {"claim": "Sécurité VERT. Correctif SEC-210 livré", "src": "Rapport_Statut_21sept", "lines": [10, 10], "loc": "tableau Synthèse, ligne Sécurité"}, "b": {"claim": "« Vous avez livré un fix. Nous n'avons pas encore donné l'acceptation sécurité de SEC-210. »", "src": "M06_Transcript_Comite_26sept", "lines": [7, 7], "loc": "10:02"}, "resolution": "La sécurité n'est pas acceptée. Qui décide : Sophie Lambert (sécurité). Le rapport confond livraison (par le fournisseur, 19 sept.) et validation (par le client), et il reconnaît avoir été écrit « avant la dernière vérification détaillée de certains tickets ». Dates : les positions de Sophie du 19 sept. (14:05) et du 26 sept. (15:40), et le comité du 26 sept., sont plus récents que le rapport du 21 sept. Le registre du 29 sept. (R-02 ouvert, probabilité élevée) est cohérent avec le ticket.", "basis": "qui décide + date des faits", "status_now": "Rapport et brouillon de communication à corriger. Voir les actions A-09 et A-10.", "extra": [["SEC-210", 23, 25], ["Teams_19sept_Securite", 5, 5], ["E11_Communication_statut", 11, 13], ["Registre_Risques_29sept", 4, 4]]}, {"id": "C-04", "theme": "accessibilité", "in_plan_or_register": false, "title": "Accessibilité « VERT, correctifs appliqués » (rapport du 21 sept.) et « conforme » (Boréal, 20 août), contre ACC-303 OUVERT (bloquant) depuis le 17 sept.", "a": {"claim": "Accessibilité VERT. Correctifs appliqués", "src": "Rapport_Statut_21sept", "lines": [12, 12], "loc": "tableau Synthèse, ligne Accessibilité"}, "b": {"claim": "« Il reste ACC-303. La modale ne permet toujours pas d'atteindre Enregistrer au clavier. Pour moi c'est un bloquant d'accessibilité avant production. »", "src": "M06_Transcript_Comite_26sept", "lines": [9, 9], "loc": "10:05"}, "resolution": "L'accessibilité n'est pas terminée. Qui décide : Mélissa Gagnon (QA et accessibilité) valide les tickets. Une correction annoncée par le fournisseur (E04, « tout devrait être conforme ») ne vaut pas validation, et elle ne portait que sur ACC-301 et 302. Dates : ACC-303 est créé le 17 sept., avant le rapport du 21 sept., et il est toujours ouvert le 26 sept. Les captures ACC-301 et 302 sont anciennes (défauts fermés les 15 et 20 août) et ne prouvent rien d'ouvert. La capture ACC-303 est confirmée par le ticket.", "basis": "qui décide + date des faits", "status_now": "ACC-303 ouvert. Condition de go-live numéro 2. Voir les actions A-02 et A-03.", "extra": [["ACC-303", 14, 16], ["E04_Corrections_accessibilite", 9, 16], ["M05_CR_Suivi_18sept", 10, 10], ["Registre_Risques_29sept", 6, 6]]}, {"id": "C-05", "theme": "portée", "in_plan_or_register": false, "title": "Portée mobile : Boréal pense que l'optimisation mobile avancée est incluse (Teams 22 sept.) et la facture (INV-003), contre la portée de la phase 1 et la décision de report en phase 2", "a": {"claim": "« Je pensais que le mobile était inclus dans le scope initial, au moins l'optimisation avancée. » Plus la ligne « Optimisation interface mobile - CR-04 » de 18 000 $", "src": "Teams_22sept_Mobile", "lines": [4, 4], "loc": "13:03"}, "b": {"claim": "« les optimisations mobiles avancées proposées dans CR-04 ne font pas partie de la phase 1 approuvée. Nous les reportons à la phase 2. »", "src": "E10_Fonction_mobile", "lines": [9, 11], "loc": "courriel du 24 sept."}, "resolution": "Hors portée. Qui décide : le contrat (la portée incluse ne mentionne pas le mobile; tout travail hors portée demande une demande de changement écrite et approuvée), la charte v1, le compte rendu de démarrage (mobile avancé jamais discuté comme livrable), le comité du 10 sept. (aucune approbation) et la décision du chargé de projet (24 sept.). CR-04 est resté un brouillon. Seule la « compatibilité de base » mobile fait partie de la phase 1 (Nicolas, Teams 22 sept.).", "basis": "qui décide (contrat + gouvernance)", "status_now": "INV-003 à corriger (18 000 $). Voir l'action A-06.", "extra": [["CONTRAT_Boreal_NOVA", 18, 24], ["M01_CR_Demarrage_07juillet", 19, 20], ["M04_Transcript_Comite_direction_10sept", 30, 35], ["INV-003", 21, 21], ["CR-04_Optimisation_mobile_BROUILLON", 8, 15]]}, {"id": "C-06", "theme": "gouvernance", "in_plan_or_register": true, "title": "Responsable du projet : Élodie Caron (charte v1, plan v2) contre Nicolas Perron (plan v3 du 12 sept., annonce du 16 sept.)", "a": {"claim": "Chargée de projet : Élodie Caron. P-06 responsable Élodie Caron", "src": "Charte_Projet_NOVA_v1", "lines": [4, 4], "loc": "ligne 4; plan v2 cellule D7"}, "b": {"claim": "« Nicolas Perron prend officiellement la charge du projet NOVA à compter d'aujourd'hui, 16 septembre. »", "src": "E06_Transition_charge_projet", "lines": [9, 9], "loc": "c té accepte SEC-210 (Sophie); 2) ACC-303 est fermé (Mélissa; correctif Boréal « prochaine build »); 3) le runbook est approuvé avec le retour arrière (Olivier; étapes 4 TODO et 5 à compléter dans la capture du 25 sept.).", "Attention : le plan v3 (12 sept.) affiche encore le 15 octobre. Il est périmé. Aucune date de go/no-go n'est documentée."]}, {"h": "Portée", "items": ["Phase 1 (charte v1, contrat) : SSO (seul mode en production), création et suivi de demandes, pièces jointes, workflow, tableau de suivi, rapports standards. Plus CR-01, rapports avancés (approuvé le 14 août).", "Hors portée : l'optimisation mobile avancée CR-04 (18 000 $, brouillon), reportée en phase 2 le 24 sept. (E10, décision de portée). La compatibilité mobile de base reste due. Données de production hébergées en Canada Central (ADR-007; migration vérifiée le 27 août)."]}, {"h": "Budget", "items": ["Autorisé : 204 000 $ CAD hors taxes = 180 000 $ (contrat, 7 juil. au 31 oct.) + 24 000 $ (CR-01). CR-04 non compris.", "Facturé : 186 000 $. Payé : 132 000 $. En validation : 54 000 $ (INV-003). Facturation valable (sans CR-04) : 168 000 $, donc 36 000 $ de marge. INV-778 (41 000 $) = projet ORION, exclue."]}, {"h": "Situation des factures", "items": ["INV-001 (31 juil.) 60 000 $ payée. INV-002 (31 août) 72 000 $ payée (jalon 2 + CR-01). INV-003 (22 sept.) 54 000 $ EN VALIDATION, retenue par Finances (E07) : la ligne CR-04 de 18 000 $ n'a pas d'approbation. À contester; demander une facture corrigée à 36 000 $ (recommandation); payer le jalon 3 après confirmation de sa livraison."]}, {"h": "Priorités (ordre proposé)", "items": ["1. Remplir les trois conditions de go-live (A-01 à A-05), dates à confirmer, avant le 22 oct. 2. Régler INV-003 (A-06). 3. Publier le plan v4 au 22 oct. et corriger le registre (R-01) (A-07, A-08). 4. Corriger le message de statut et le rapport du 21 sept.; ne pas annoncer « au vert » (A-09, A-10). 5. Planifier le go/no-go et publier le compte rendu du 26 sept. (A-11). 6. Surveiller la fin du contrat le 31 oct. (A-13)."]}], "footer": "Chaque affirmation renvoie à un fichier et à un repère dans la mémoire consultable (index.html). « À confirmer » veut dire qu'aucune date n'est documentée dans le dossier."}, "update_template": {"id": "U-01", "received_at": "AAAA-MM-JJTHH:MM (heure réelle de réception pendant le défi)", "event_date": "AAAA-MM-JJ (date fictive de l'événement, si elle est donnée)", "source": {"file": "nom du fichier reçu (à déposer dans corpus/09_Evenement/)", "loc": "repère précis (ligne, page, heure)", "quote": "citation mot pour mot"}, "summary": "Ce qui vient de changer, en une phrase, sans interprétation.", "problem_status": "Statut du PROBLÈME concerné (ex. : SEC-210 toujours EN VALIDATION; ACC-303 fermé par Mélissa le …; runbook livré mais pas approuvé).", "prior_decision": "Décision ANTÉRIEURE qui reste en vigueur tant qu'une instance ne l'a pas changée (ex. : 22 octobre approuvé le 10 sept., sous les trois conditions du 26 sept.).", "new_proposal": "Nouvelle PROPOSITION, s'il y en a une : qui la fait, à qui, et le fait qu'elle n'est PAS approuvée tant qu'une décision n'est pas documentée.", "affected_facts": [{"ref": "Q01 / D-01 / C-03 …", "before": "valeur du baseline", "after": "valeur mise à jour", "evidence": "fichier + repère"}], "affected_actions": [{"ref": "A-0x", "change": "fermée / modifiée / date précisée / nouvelle", "evidence": "fichier + repère"}], "new_actions": [{"id": "A-14", "title": "…", "owner": "… (confirmé ou proposé)", "due": "date connue ou « à confirmer »", "evidence": "fichier + repère"}], "unchanged": "Ce qui ne change PAS : les autres conditions de go-live restent ouvertes; aucune approbation n'est inventée; le baseline du 30 sept. est conservé.", "uncertainty": "Ce que l'événement ne dit pas."}, "usage": {"open": ["Ouvrir index.html dans un navigateur (Chrome, Edge, Firefox ou Safari). Pas de serveur, rien à installer, pas de compte, pas d'abonnement. Tout est dans le fichier : textes extraits, captures, données.", "Le dossier corpus/ contient la copie complète du dossier reçu (Projet360_NOVA_ETUDIANTS). Les liens « Ouvrir le fichier original » pointent vers ces fichiers. Selon le navigateur, un PDF ou un .eml peut s'ouvrir dans une autre application.", "Brief_reprise_NOVA.pdf (une page), Mode_emploi.md et Reponses_Q01-Q10.md sont les versions à imprimer. nova_memory.json est la mémoire structurée, réutilisable par un autre outil ou un chatbot."], "navigate": ["Onglets : Brief, Questions (Q01 à Q10), Chronologie, Décisions, Contradictions, Actions, Sources, Mise à jour, Mode d'emploi.", "Chaque affirmation porte une puce de preuve [fichier · repère]. Un clic ouvre le fichier avec les lignes citées surlignées. Pour une capture, l'image s'affiche avec sa transcription.", "Recherche (barre en haut) : cherche à la fois dans la mémoire (réponses, décisions, actions) et dans le texte complet des 64 fichiers. Exemples : « rollback », « 18 000 », « Canada Central », « déployé ».", "Filtres de la chronologie : par thème (sécurité, finances…) et par type (proposition, décision, validation, contradiction). Les entrées anciennes sont grisées. Le bouton « valable au 30 sept. seulement » les cache.", "Choix de vue (en haut) : « Baseline 30 sept. 9 h » ou « Mis à jour (événement) ». Le baseline n'est jamais modifié : les mises à jour sont des couches datées qui s'ajoutent par-dessus."], "tools": ["Extraction : Python 3 (module email pour les .eml, openpyxl pour les .xlsx, pdftotext pour les PDF, Tesseract pour lire les captures). Le fichier sources.json contient le texte extrait et les empreintes SHA-256 (pour repérer les pièces jointes en double).", "Analyse et rédaction : assistant IA (Claude) pour la lecture croisée, les réponses et les registres. Chaque fait a été vérifié à la main dans le fichier source avant d'être gardé.", "Rendu : HTML, CSS et JavaScript sans dépendance externe (fonctionne hors ligne, en file://).", "Aide rapide à la fiche d'événement (sans IA) : l'outil reconnaît par mots-clés qui parle, la nature du document et les sujets touchés, puis applique des règles fixes (qui a le pouvoir de valider quoi, ce qui reste ouvert, quels identifiants sont touchés) pour remplir la fiche. Instantané, vérifiable, et c'est le chemin recommandé pendant la présentation.", "Assistant IA local (optionnel) : un modèle de langage qui tourne sur l'ordinateur (Ollama ou LM Studio, aucune donnée ne sort). Il sert à deux choses : répondre à une question en langage naturel en citant fichier et ligne (onglet Assistant IA), et pré-remplir la fiche d'événement (onglet Mise à jour). Il ne décide rien : il rédige un brouillon, et un humain vérifie chaque ligne. Les dix réponses du baseline ont été vérifiées à la main, pas générées par ce modèle."], "manual": ["Lecture visuelle des 8 captures d'écran (l'OCR a été corrigé à la main : « TODO », « À compléter », « --- », etc.).", "Choix de qui décide quoi et résolution des contradictions : jugement humain, expliqué dans l'onglet Contradictions.", "Rédaction des actions « recommandation » (séparées des engagements documentés) et des dates « à confirmer ».", "Intégration de la nouvelle information : l'aide rapide (règles) ou le modèle local proposent un brouillon, mais les passages « À COMPLÉTER », la vérification, la correction et l'enregistrement sont faits à la main dans l'onglet Mise à jour, puis export dans updates.js."], "limits": ["L'assistant IA est optionnel et local : sans Ollama ou LM Studio, il ne répond pas, et tout le reste fonctionne (recherche par mots-clés, onglet Questions, fiche à remplir à la main).", "Testé sur un MacBook Pro sans GPU avec qwen2.5:7b : environ 7 minutes par fiche, et le brouillon contenait des erreurs graves (un ticket « fermé » par une personne qui n'avait rien validé, un livrable « livré » qui n'était qu'annoncé, une action qui suivait la demande du fournisseur). C'est pour cela que l'aide rapide par règles est le chemin recommandé en direct, et que le modèle sert surtout aux questions préparées d'avance.", "Un modèle local peut se tromper, surtout sur qui a le pouvoir de décider. C'est pour ça qu'il cite ses sources, que les citations sont cliquables, et qu'un contrôle de forme signale les références ou lignes qui n'existent pas. La réponse du modèle est toujours marquée « brouillon, à vérifier ».", "La recherche de passages est par mots-clés (pas de base vectorielle) : une question formulée avec d'autres mots que le dossier peut rater un passage. Reformulez avec les mots du projet (SEC-210, runbook, CR-04…).", "Les montants sont comparés en CAD hors taxes, tels qu'écrits. Aucun calcul de taxes.", "Les PDF sont affichés en texte extrait (mise en page approximative). L'original est accessible par lien.", "Les heures des transcriptions sont celles des documents. Les fuseaux horaires ne sont pas normalisés."], "uncertain": ["Dates inconnues : re-test SEC-210; « prochaine build » (correctif ACC-303); livraison du runbook final; go/no-go.", "Auteur du rapport de statut du 21 sept. inconnu. Plafond budgétaire qu'il utilise non précisé.", "Pas de réponse écrite de Nicolas à Finances (INV-003) ni à Alex (communication) dans le dossier. Compte rendu du comité du 26 sept. annoncé mais absent.", "Livraison réelle du jalon 3 (36 000 $) non documentée. Date exacte de la build de stabilisation non documentée.", "Date à laquelle la transition Élodie vers Nicolas a été « convenue » (le plan v3 du 12 sept. l'anticipe).", "Rôle exact de Boréal dans la rédaction du runbook (déduit de « je relance notre équipe ops »)."]}, "sources": [{"id": "MANIFEST", "path": "MANIFEST.csv", "file": "MANIFEST.csv", "category": "Racine du dossier", "kind": "csv", "text": "fichier,extension,taille_octets\n01_Courriels/E01_Lancement_NOVA.eml,.eml,735\n01_Courriels/E02_Question_hebergement.eml,.eml,32535\n01_Courriels/E03_Confirmation_Canada_Central.eml,.eml,32692\n01_Courriels/E04_Corrections_accessibilite.eml,.eml,745\n01_Courriels/E05_Retard_in

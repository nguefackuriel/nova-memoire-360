pdf,.pdf,23365\n05_Contrats_et_finances/INV-001.pdf,.pdf,23376\n05_Contrats_et_finances/INV-002.pdf,.pdf,23396\n05_Contrats_et_finances/INV-003.pdf,.pdf,23639\n06_Architecture_et_decisions/ADR-007_Localisation_donnees.md,.md,680\n06_Architecture_et_decisions/Architecture_NOVA_v1.pdf,.pdf,23340\n06_Architecture_et_decisions/Architecture_NOVA_v2.pdf,.pdf,23423\n06_Architecture_et_decisions/Decision_Portee_Phase2.md,.md,465\n07_Conversations_Teams/Teams_15sept_ProjetNOVA.txt,.txt,344\n07_Conversations_Teams/Teams_16sept_Transition.txt,.txt,325\n07_Conversations_Teams/Teams_19sept_Securite.txt,.txt,282\n07_Conversations_Teams/Teams_22sept_Mobile.txt,.txt,338\n08_Archives_et_documents_connexes/Courriel_archive_17sept.eml,.eml,722\n08_Archives_et_documents_connexes/INV-778_Projet_ORION.pdf,.pdf,23435\n08_Archives_et_documents_connexes/Invitation_Formation_Excel.txt,.txt,184\n08_Archives_et_documents_connexes/Newsletter_Boreal_Septembre.txt,.txt,201\n08_Archives_et_documents_connexes/Notes_personnelles_quelquun.txt,.txt,199\n08_Archives_et_documents_connexes/Plan_NOVA_preliminaire_juin.xlsx,.xlsx,4197\nREADME.txt,.txt,7103", "sha256": "ad3ed0709f2bd6eec1763afb6c63ca23e30c0005cb4551e7bebb3333ee697dce", "bytes": 3412}, {"id": "README", "path": "README.txt", "file": "README.txt", "category": "Racine du dossier", "kind": "txt", "text": "DÉFI 24H — PROJET 360 — NOVA\n\nMISSION\nVous reprenez NOVA, un projet fictif dont les informations sont dispersées. En 24 heures, construisez une mémoire opérationnelle qui permet à une autre personne de comprendre l'état du projet, de retrouver les preuves et de préparer les prochaines actions.\n\nLe dossier initial représente les informations disponibles le 30 septembre 2026 à 09 h 00, heure de Montréal (UTC−04:00). Répondez selon cette date fictive, et non selon la date réelle de l'épreuve. Une nouvelle information sera fournie pendant le défi.\n\nFORMAT ET OUTILS\n- Aucune technologie imposée. Un dossier documentaire navigable, un site, un outil de recherche ou une application sont acceptés. Un chatbot et une ingestion entièrement automatique ne sont pas obligatoires.\n- La solution doit permettre de retrouver une preuve, de répondre à une question et de mettre à jour l'état du projet sans effacer son historique.\n- Outils d'IA, bibliothèques et services externes autorisés. Indiquez les outils utilisés et les étapes manuelles. Aucun abonnement payant ne doit être nécessaire au jury pour consulter le rendu; fournissez un export autonome si nécessaire.\n- Les faits concernant NOVA doivent provenir du corpus remis. Une recherche externe peut aider à utiliser un outil, mais ne remplace pas une preuve du projet.\n\nLIVRABLES\n1. Un brief de reprise d'une page maximum : responsable, date approuvée et conditions, portée, budget, situation des factures et priorités.\n2. Une mémoire consultable avec chronologie, décisions, contradictions résolues, sources et actions restantes. Pour chaque action : responsable proposé ou confirmé, preuve, et échéance connue ou « à confirmer ». Distinguez une recommandation de votre équipe d'un engagement déjà documenté.\n3. Les réponses aux dix questions ci-dessous, chacune avec un fichier source et un repère précis (page, cellule, commentaire daté, passage ou capture).\n4. Après la nouvelle information : état actualisé, changements par rapport au baseline, preuves et actions touchées. Conservez la version initiale.\n5. Un court mode d'emploi : ouverture, navigation, outils utilisés, traitements manuels, limites et informations incertaines.\n\nQUESTIONS INITIALES\nQ01. Quelle est la date de mise en production actuellement approuvée, et avec quelle réserve?\nQ02. Pourquoi la date a-t-elle changé, et quel est l'état actuel de la cause initiale?\nQ03. Qui a approuvé le changement et quand? Distinguez proposition et approbation.\nQ04. Qui est responsable du projet et depuis quand?\nQ05. Quel est le montant contractuel autorisé et comment se calcule-t-il?\nQ06. Quel problème présente INV-003? Précisez le montant concerné et le traitement à prévoir.\nQ07. Où les données de production doivent-elles être hébergées? Quelle preuve confirme la mise en œuvre?\nQ08. La sécurité est-elle acceptée? Distinguez livraison et validation.\nQ09. L'accessibilité est-elle complétée? Identifiez ce qui reste à corriger.\nQ10. Quelles sont les trois conditions de go-live? Précisez les travaux manquants du runbook à partir de sa capture.\n\nÉVALUATION — 100 POINTS\n- Dix réponses factuelles initiales : 50 points. Chaque réponse vaut 0, 3 ou 5 points selon son exactitude et sa nuance.\n- Preuves et navigation : 10 points.\n- Chronologie et contradictions : 10 points.\n- Brief et actions : 10 points.\n- Utilisation et incertitude : 10 points.\n- Mise à jour après l'événement : 10 points.\nChaque critère pratique comporte deux constats de 5 points :\n- Preuves : au moins trois réponses avec un fichier et un repère retrouvables; au moins deux de ces réponses croisent des sources distinctes.\n- Chronologie : distinguer proposition, décision et validation avec dates/sources; expliquer au moins deux contradictions par l'autorité ou la date des faits, dont une dans un plan ou un registre de risques.\n- Brief/actions : couvrir les cinq thèmes demandés dans une page; relier les trois conditions de lancement à des actions, responsables et échéances connues ou à confirmer.\n- Utilisation : le jury peut ouvrir le rendu et retrouver une preuve; l'équipe montre sa recherche et explicite les limites lors de la question complémentaire.\n- Mise à jour : distinguer statut du problème, décision antérieure et nouvelle proposition; conserver le baseline et produire les impacts/actions sourcés sans inventer d'approbation ni fermer d'autres conditions.\n\nLes cinq critères pratiques valent chacun 0, 5 ou 10 points. Une belle interface, une technologie particulière ou le seul recours à l'IA ne donnent pas de points supplémentaires. La précision, les preuves et l'utilité priment.\n\nRÈGLES DE LECTURE\n- Toutes les personnes, entreprises, adresses et données sont fictives.\n- Certaines sources sont anciennes, incomplètes, contradictoires ou peu utiles. Les contradictions font partie du défi.\n- Analysez le contenu et son autorité; une date de fichier récente ne garantit pas une information exacte.\n- Les pièces jointes et captures font partie des sources. Certaines pièces jointes sont aussi présentes comme fichiers séparés : ne les comptez pas comme des confirmations indépendantes.\n- Une correction annoncée n'est pas nécessairement acceptée. Une proposition n'est pas une décision.\n- Une capture historique ne démontre pas à elle seule qu'un défaut reste ouvert.\n- Si une information manque, indiquez-le. N'inventez ni décision, ni échéance, ni approbation.\n- Pour cet exercice, les montants financiers sont comparables en CAD, hors taxes. Distinguez autorisé, facturé et payé; aucun calcul fiscal n’est demandé.", "sha256": "034101b02eddd8a27ccf974ddc19948d503c1c5f5b37169ca08f37223d464a86", "bytes": 5741}, {"id": "Teams_15sept_ProjetNOVA", "path": "07_Conversations_Teams/Teams_15sept_ProjetNOVA.txt", "file": "Teams_15sept_ProjetNOVA.txt", "category": "Conversations Teams", "kind": "txt", "text": "Canal : Projet NOVA / Général\n15 septembre 2026\n\n09:12 - Alex : On est toujours bons pour le 15 octobre? Je prépare la communication aux équipes.\n09:18 - Nicolas : Non, attention : le comité a approuvé le 22 octobre le 10 septembre. Le plan projet n'a visiblement pas encore été corrigé.\n09:20 - Alex : Merci, je change mon brouillon.", "sha256": "b2d3e858d099cb932eaaaa88822755515783307c6db0ab40326709dad1ab4308", "bytes": 344}, {"id": "Teams_16sept_Transition", "path": "07_Conversations_Teams/Teams_16sept_Transition.txt", "file": "Teams_16sept_Transition.txt", "category": "Conversations Teams", "kind": "txt", "text": "Canal : Projet NOVA / Général\n16 septembre 2026\n\n08:45 - Élodie : Petit rappel : à partir d'aujourd'hui, Nicolas reprend officiellement NOVA. Merci de l'inclure dans les suivis et décisions. Je reste joignable quelques jours pour la transition.\n08:47 - Nicolas : Merci Élodie. Je reprends aussi le comité du vendredi.", "sha256": "397803af2ef9cea12956556a44ad00e57dd619cf8b49baa95462ad01e567dbfe", "bytes": 325}, {"id": "Teams_19sept_Securite", "path": "07_Conversations_Teams/Teams_19sept_Securite.txt", "file": "Teams_19sept_Securite.txt", "category": "Conversations Teams", "kind": "txt", "text": "Canal : NOVA / Sécurité\n19 septembre 2026\n\n10:24 - Julien (Boréal) : SEC-210 devrait être good maintenant, le fix est déployé.\n10:31 - Sophie : Merci. On garde le ticket en validation jusqu'à notre re-test. « déployé » != « accepté » :)\n10:34 - Julien : yep, compris.", "sha256": "5eae0d5d720d452834bf31b480a6a6d017a04a39816764ca5c7b8a70f0323e31", "bytes": 282}, {"id": "Teams_22sept_Mobile", "path": "07_Conversations_Teams/Teams_22sept_Mobile.txt", "file": "Teams_22sept_Mobile.txt", "category": "Conversations Teams", "kind": "txt", "text": "Canal : Projet NOVA / Général\n22 septembre 2026\n\n13:03 - Julien (Boréal) : Je pensais que le mobile était inclus dans le scope initial, au moins l'optimisation avancée.\n13:06 - Nicolas : La compatibilité de base oui. Le package d'optimisation CR-04 à 18k non. Il n'est pas approuvé.\n13:10 - Julien : Je vérifie avec mon équipe.", "sha256": "0b8594a1ad14d50cc41405f9a742872a55e6a2db23ad489aed8f563705cbdafd", "bytes": 338}, {"id": "ADR-007_Localisation_donnees", "path": "06_Architecture_et_decisions/ADR-007_Localisation_donnees.md", "file": "ADR-007_Localisation_donnees.md", "category": "Architecture et décisions", "kind": "md", "text": "# ADR-007 - Localisation des données de production\n\n**Date de décision :** 23 juillet 2026  \n**Statut :** Acceptée\n\n## Contexte\nL'architecture initiale de NOVA utilisait une région américaine. L'équipe sécurité demande que les données de production du projet demeurent au Canada.\n\n## Décision\nL'environnement de production de NOVA sera déployé dans **Canada Central**. L'architecture v1 doit être considérée comme remplacée sur ce point.\n\n## Conséquences\n- Boréal doit migrer les ressources prévues.\n- L'équipe architecture doit publier une version mise à jour du schéma.\n- Une validation technique doit confirmer la migration avant les tests de production.", "sha256": "49df032a0f1ca7fbcf6e576c20b6f4ff1c5678d68d5f8bc7706192103518ca2e", "bytes": 680}, {"id": "Architecture_NOVA_v1", "path": "06_Architecture_et_decisions/Architecture_NOVA_v1.pdf", "file": "Architecture_NOVA_v1.pdf", "category": "Architecture et décisions", "kind": "pdf", "text": "Architecture NOVA - v1 - 18 juillet 2026\nVersion initiale préparée avant la décision de localisation des données.\n\n             Utilisateur                              Portail NOVA         API\n\n                                                         Données\n                                                         East US\n\nSchéma fictif - Projet 360", "sha256": "a7610ddc9b988a9f2c521deecc1583ce7193247b2956d491b8ae02c6eb1b5896", "bytes": 23340}, {"id": "Architecture_NOVA_v2", "path": "06_Architecture_et_decisions/Architecture_NOVA_v2.pdf", "file": "Architecture_NOVA_v2.pdf", "category": "Architecture et décisions", "kind": "pdf", "text": "Architecture NOVA - v2 - 25 août 2026\nVersion révisée après ADR-007.\n\n             Utilisateur          Portail NOVA    API\n\n                                    Données\n                                 Canada Central\n\nSchéma fictif - Projet 360", "sha256": "ba22b0f3376d11cb538df93ca89138ae99f3a317d00d50d97c5261bd1998e801", "bytes": 23423}, {"id": "Decision_Portee_Phase2", "path": "06_Architecture_et_decisions/Decision_Portee_Phase2.md", "file": "Decision_Portee_Phase2.md", "category": "Architecture et décisions", "kind": "md", "text": "# Décision de portée - expérience mobile avancée\n\n**Date :** 24 septembre 2026  \n**Décision :** Les optimisations mobiles avancées associées à la demande CR-04 sont reportées à la phase 2.\n\nLa phase 1 doit demeurer utilisable sur mobile, mais les travaux d'optimisation avancée proposés par Boréal ne font pas partie de la portée approuvée de la phase 1. Aucune dépense additionnelle liée à CR-04 ne doit être engagée sans nouvelle approbation.", "sha256": "a40891b2324cbd8041d8f7cecc4cc3638d8b2ae3bae1c3ba791b106748b851b5", "bytes": 465}, {"id": "E01_Lancement_NOVA", "path": "01_Courriels/E01_Lancement_NOVA.eml", "file": "E01_Lancement_NOVA.eml", "category": "Courriels", "kind": "eml", "subject": "NOVA - confirmation du démarrage", "date": "Tue, 07 Jul 2026 16:10:00 -0400", "from": "Élodie Caron <elodie.caron@demo.example>", "attachments": [], "text": "From: Élodie Caron <elodie.caron@demo.example>\nTo: equipe-nova@demo.example\nDate: Tue, 07 Jul 2026 16:10:00 -0400\nSubject: NOVA - confirmation du démarrage\nMessage-ID: <e01_lancement_nova@nova.demo.local>\n\nBonjour,\n\nMerci pour la rencontre de ce matin. Je confirme le démarrage de NOVA.\n\nLes éléments de référence sont ceux de la charte : budget initial de 180 000 $, mise en production ciblée au 15 octobre et je prends le rôle de chargée de projet.\n\nMerci de me signaler rapidement tout enjeu susceptible d'affecter le chemin critique.\n\nÉlodie", "sha256": "16d41dcca06f62c1542d694cd80f3146d64ba98d44d48bae1a168dc36117885e", "bytes": 735}, {"id": "E02_Question_hebergement", "path": "01_Courriels/E02_Question_hebergement.eml", "file": "E02_Question_hebergement.eml", "category": "Courriels", "kind": "eml", "subject": "RE: NOVA - architecture v1", "date": "Wed, 22 Jul 2026 14:32:00 -0400", "from": "Sophie Lambert <sophie.lambert@demo.example>", "attachments": [{"name": "Architecture_NOVA_v1.pdf", "bytes": 23340, "sha256": "a7610ddc9b988a9f2c521deecc1583ce7193247b2956d491b8ae02c6eb1b5896", "same_as": ["06_Architecture_et_decisions/Architecture_NOVA_v1.pdf"]}], "text": "From: Sophie Lambert <sophie.lambert@demo.example>\nTo: elodie.caron@demo.example, marc.gervais@demo.example\nDate: Wed, 22 Jul 2026 14:32:00 -0400\nSubject: RE: NOVA - architecture v1\nMessage-ID: <e02_question_hebergement@nova.demo.local>\n\nBonjour,\n\nJe vois East US sur le diagramme joint. Avant qu'on aille plus loin, est-ce que quelqu'un peut confirmer si cette localisation est compatible avec nos exigences pour NOVA?\n\nPour ma part, je veux que les données de production demeurent au Canada. À trancher demain en atelier.\n\nSophie\n\n[Pièce jointe] Architecture_NOVA_v1.pdf (23340 octets)", "sha256": "de9da47af28142b5e033ef467c2bd932020f88d57112a724b5b822d98c4ef1a5", "bytes": 32535}, {"id": "E03_Confirmation_Canada_Central", "path": "01_Courriels/E03_Confirmation_Canada_Central.eml", "file": "E03_Confirmation_Canada_Central.eml", "category": "Courriels", "kind": "eml", "subject": "NOVA - migration Canada Central complétée", "date": "Wed, 26 Aug 2026 09:05:00 -0400", "from": "Julien Moreau <julien.moreau@boreal.example>", "attachments": [{"name": "Architecture_NOVA_v2.pdf", "bytes": 23423, "sha256": "ba22b0f3376d11cb538df93ca89138ae99f3a317d00d50d97c5261bd1998e801", "same_as": ["06_Architecture_et_decisions/Architecture_NOVA_v2.pdf"]}], "text": "From: Julien Moreau <julien.moreau@boreal.example>\nTo: marc.gervais@demo.example, elodie.caron@demo.example\nDate: Wed, 26 Aug 2026 09:05:00 -0400\nSubject: NOVA - migration Canada Central complétée\nMessage-ID: <e03_confirmation_canada_central@nova.demo.local>\n\nBonjour,\n\nLa migration des ressources prévues pour NOVA vers Canada Central est complétée. Vous trouverez le schéma v2 en pièce jointe.\n\nNous avons fait un test de déploiement et de connectivité hier soir. Aucun blocage identifié.\n\nJulien\nBoréal Numérique\n\n[Pièce jointe] Architecture_NOVA_v2.pdf (23423 octets)", "sha256": "0a35012f106e1bb673fbd1b674052038a86cf426f44817bd85ddff4a36dbde73", "bytes": 32692}, {"id": "E04_Corrections_accessibilite", "path": "01_Courriels/E04_Corrections_accessibilite.eml", "file": "E04_Corrections_accessibilite.eml", "category": "Courriels", "kind": "eml", "subject": "RE: anomalies accessibilité NOVA", "date": "Thu, 20 Aug 2026 15:44:00 -0400", "from": "Julien Moreau <julien.moreau@boreal.example>", "attachments": [], "text": "From: Julien Moreau <julien.moreau@boreal.example>\nTo: melissa.gagnon@demo.example\nDate: Thu, 20 Aug 2026 15:44:00 -0400\nSubject: RE: anomalies accessibilité NOVA\nMessage-ID: <e04_corrections_accessibilite@nova.demo.local>\n\nSalut Mélissa,\n\nOn a poussé les corrections de labels et de contraste. Tout devrait maintenant être conforme de notre côté.\n\nTu peux refaire ton passage quand tu veux.\n\nJulien\n\n> Le 12 août, Mélissa écrivait :\n> Plusieurs points à corriger, notamment les labels et le contraste. Je veux aussi repasser les modales au clavier dans une prochaine build.", "sha256": "87cee73a04d819808b90a985b4a4f7f43baac05fa17db73f9b3f5cbf7a4c154d", "bytes": 745}, {"id": "E05_Retard_integration", "path": "01_Courriels/E05_Retard_integration.eml", "file": "E05_Retard_integration.eml", "category": "Courriels", "kind": "eml", "subject": "NOVA - risque sur la date du 15 octobre", "date": "Tue, 08 Sep 2026 11:16:00 -0400", "from": "Julien Moreau <julien.moreau@boreal.example>", "attachments": [], "text": "From: Julien Moreau <julien.moreau@boreal.example>\nTo: elodie.caron@demo.example, nicolas.perron@demo.example\nDate: Tue, 08 Sep 2026 11:16:00 -0400\nSubject: NOVA - risque sur la date du 15 octobre\nMessage-ID: <e05_retard_integration@nova.demo.local>\n\nBonjour,\n\nLe problème du connecteur interne nous a fait perdre davantage de temps que prévu. Nous pouvons continuer à viser le 15 octobre, mais ce serait avec très peu de marge pour la stabilisation.\n\nNotre recommandation est de déplacer la mise en production au **22 octobre**.\n\nÀ ce stade, il s'agit d'une proposition de notre part. À vous de confirmer la décision de gouvernance.\n\nJulien", "sha256": "633c8d1c96a5eedc154dcbaa73d4fef79fea99984f6e47c8563d7df02f6b3f39", "bytes": 794}, {"id": "E06_Transition_charge_projet", "path": "01_Courriels/E06_Transition_charge_projet.eml", "file": "E06_Transition_charge_projet.eml", "category": "Courriels", "kind": "eml", "subject": "NOVA - transition de la charge de projet", "date": "Wed, 16 Sep 2026 08:35:00 -0400", "from": "Élodie Caron <elodie.caron@demo.example>", "attachments": [], "text": "From: Élodie Caron <elodie.caron@demo.example>\nTo: equipe-nova@demo.example\nDate: Wed, 16 Sep 2026 08:35:00 -0400\nSubject: NOVA - transition de la charge de projet\nMessage-ID: <e06_transition_charge_projet@nova.demo.local>\n\nBonjour,\n\nComme convenu, Nicolas Perron prend officiellement la charge du projet NOVA à compter d'aujourd'hui, 16 septembre.\n\nJe demeure disponible quelques jours pour assurer le transfert, mais merci de diriger les décisions et suivis futurs vers Nicolas.\n\nMerci à tous,\nÉlodie", "sha256": "ed6b53e0165bf6228370b54c37b12ea52649c2a29db530f89297c1038279747a", "bytes": 648}, {"id": "E07_Facture_003_question", "path": "01_Courriels/E07_Facture_003_question.eml", "file": "E07_Facture_003_question.eml", "category": "Courriels", "kind": "eml", "subject": "INV-003 - référence CR-04?", "date": "Wed, 23 Sep 2026 10:18:00 -0400", "from": "Amélie Fortin <amelie.fortin@demo.example>", "attachments": [{"name": "INV-003.pdf", "bytes": 23639, "sha256": "cf664b7caf782ccfbfd1d84428a4a0df7212b9fadacc69caff0192e0ba053d05", "same_as": ["05_Contrats_et_finances/INV-003.pdf"]}], "text": "From: Amélie Fortin <amelie.fortin@demo.example>\nTo: nicolas.perron@demo.example\nDate: Wed, 23 Sep 2026 10:18:00 -0400\nSubject: INV-003 - référence CR-04?\nMessage-ID: <e07_facture_003_question@nova.demo.local>\n\nBonjour Nicolas,\n\nJe valide INV-003 et j'ai une question avant de la libérer.\n\nIl y a une ligne de 18 000 $ « Optimisation interface mobile - CR-04 ». Peux-tu me transmettre l'approbation correspondante? Je trouve un brouillon de CR-04, mais rien qui indique qu'il a été approuvé.\n\nJe joins la facture reçue.\n\nMerci,\nAmélie\nFinances\n\n[Pièce jointe] INV-003.pdf (23639 octets)", "sha256": "60b9a373d7c51fb44b6018518a52ba93d6f8fc9ed985182fae61f57d08328c93", "bytes": 33006}, {"id": "E08_Correctif_journalisation", "path": "01_Courriels/E08_Correctif_journalisation.eml", "file": "E08_Correctif_journalisation.eml", "category": "Courriels", "kind": "eml", "subject": "SEC-210 - correctif déployé", "date": "Sat, 19 Sep 2026 10:20:00 -0400", "from": "Julien Moreau <julien.moreau@boreal.example>", "attachments": [], "text": "From: Julien Moreau <julien.moreau@boreal.example>\nTo: sophie.lambert@demo.example, nicolas.perron@demo.example\nDate: Sat, 19 Sep 2026 10:20:00 -0400\nSubject: SEC-210 - correctif déployé\nMessage-ID: <e08_correctif_journalisation@nova.demo.local>\n\nBonjour,\n\nLe correctif pour SEC-210 est déployé en validation depuis ce matin. Nos tests automatisés passent et, pour nous, le problème est corrigé.\n\nSophie, tu peux faire ton re-test quand ton équipe est disponible.\n\nJulien", "sha256": "84dbdb541a8411dbaafc0d47f1cb75cfe3075f16e5bf9c8abc97bfad52f7df87", "bytes": 627}, {"id": "E09_Rappel_mise_en_production", "path": "01_Courriels/E09_Rappel_mise_en_production.eml", "file": "E09_Rappel_mise_en_production.eml", "category": "Courriels", "kind": "eml", "subject": "NOVA - cible du 22 octobre et conditions restantes", "date": "Sun, 27 Sep 2026 17:02:00 -0400", "from": "Nicolas Perron <nicolas.perron@demo.example>", "attachments": [], "text": "From: Nicolas Perron <nicolas.perron@demo.example>\nTo: equipe-nova@demo.example\nDate: Sun, 27 Sep 2026 17:02:00 -0400\nSubject: NOVA - cible du 22 octobre et conditions restantes\nMessage-ID: <e09_rappel_mise_en_production@nova.demo.local>\n\nBonjour,\n\nPetit rappel pour éviter les versions différentes : la cible approuvée demeure le 22 octobre.\n\nCette date est toutefois conditionnelle aux validations restantes : sécurité, accessibilité et préparation exploitation. Le comité du 26 septembre a précisé les éléments à fermer.\n\nMerci de ne pas communiquer le 22 comme un go garanti tant que ces validations ne sont pas terminées.\n\nNicolas", "sha256": "fc41345262e7c6855a08a6843772102aa9572c3ac0ba1e6f66f1b63cf826021b", "bytes": 840}, {"id": "E10_Fonction_mobile", "path": "01_Courriels/E10_Fonction_mobile.eml", "file": "E10_Fonction_mobile.eml", "category": "Courriels", "kind": "eml", "subject": "NOVA - CR-04 / mobile", "date": "Thu, 24 Sep 2026 13:42:00 -0400", "from": "Nicolas Perron <nicolas.perron@demo.example>", "attachments": [{"name": "CR-04_Optimisation_mobile_BROUILLON.pdf", "bytes": 23365, "sha256": "190ebc7f862023592d80cfa4c3bb3ebebc2ea8e5613d2af26ea2fc412ee9d29d", "same_as": ["05_Contrats_et_finances/CR-04_Optimisation_mobile_BROUILLON.pdf"]}], "text": "From: Nicolas Perron <nicolas.perron@demo.example>\nTo: julien.moreau@boreal.example, amelie.fortin@demo.example\nDate: Thu, 24 Sep 2026 13:42:00 -0400\nSubject: NOVA - CR-04 / mobile\nMessage-ID: <e10_fonction_mobile@nova.demo.local>\n\nBonjour,\n\nPour clarifier la portée : les optimisations mobiles avancées proposées dans CR-04 ne font pas partie de la phase 1 approuvée. Nous les reportons à la phase 2.\n\nAucune dépense liée à CR-04 ne doit être engagée ou facturée sans nouvelle approbation.\n\nNicolas\n\n[Pièce jointe] CR-04_Optimisation_mobile_BROUILLON.pdf (23365 octets)", "sha256": "b986e175dcba9d85386a5ee0498a1e2c49326ee93656fa2e6e39edcba27671f1", "bytes": 32600}, {"id": "E11_Communication_statut", "path": "01_Courriels/E11_Communication_statut.eml", "file": "E11_Communication_statut.eml", "category": "Courriels", "kind": "eml", "subject": "Brouillon communication NOVA - projet au vert", "date": "Mon, 21 Sep 2026 16:28:00 -0400", "from": "Alex Deschamps <alex.deschamps@demo.example>", "attachments": [{"name": "Rapport_Statut_21sept.pdf", "bytes": 23729, "sha256": "78fe43e6769c4e8284620282526b5313da427e9f22c1b55aeaf7a31848651537", "same_as": ["04_Documents_projet/Rapport_Statut_21sept.pdf"]}], "text": "From: Alex Deschamps <alex.deschamps@demo.example>\nTo: nicolas.perron@demo.example\nDate: Mon, 21 Sep 2026 16:28:00 -0400\nSubject: Brouillon communication NOVA - projet au vert\nMessage-ID: <e11_communication_statut@nova.demo.local>\n\nSalut Nicolas,\n\nJe prépare le petit message de statut. Je pensais écrire :\n\n« NOVA est au vert. La sécurité et l'accessibilité sont complétées et le projet vise le 22 octobre. »\n\nDis-moi si ça te va. Je me base surtout sur le rapport de statut que j'ai reçu.\n\nAlex\n\n[Pièce jointe] Rapport_Statut_21sept.pdf (23729 octets)", "sha256": "972082b171043093e629265d5096119369bf0dcee9987fc6b1a9038cf9b508d6", "bytes": 33071}, {"id": "E12_Resolution_integration", "path": "01_Courriels/E12_Resolution_integration.eml", "file": "E12_Resolution_integration.eml", "category": "Courriels", "kind": "eml", "subject": "INT-101 fermé - connecteur validé", "date": "Thu, 17 Sep 2026 16:22:00 -0400", "from": "Marc Gervais <marc.gervais@demo.example>", "attachments": [], "text": "From: Marc Gervais <marc.gervais@demo.example>\nTo: nicolas.perron@demo.example, julien.moreau@boreal.example\nDate: Thu, 17 Sep 2026 16:22:00 -0400\nSubject: INT-101 fermé - connecteur validé\nMessage-ID: <e12_resolution_integration@nova.demo.local>\n\nBonjour,\n\nJe confirme que nous avons rejoué les scénarios du connecteur après le correctif. 120/120 recherches ont retourné les résultats attendus.\n\nINT-101 est fermé. Le problème d'intégration qui avait déclenché le risque d'échéancier est considéré résolu.\n\nMarc", "sha256": "cc160700b60236dd105f051ba1ab6aa16f222bdadb31d7f29f7ea7151edf1398", "bytes": 722, "duplicate_of": ["08_Archives_et_documents_connexes/Courriel_archive_17sept.eml"]}, {"id": "CONTRAT_Boreal_NOVA", "path": "05_Contrats_et_finances/CONTRAT_Boreal_NOVA.pdf", "file": "CONTRAT_Boreal_NOVA.pdf", "category": "Contrats et finances", "kind": "pdf", "text": "                     CONTRAT DE SERVICES - PROJET NOVA\n Parties\n Client fictif : Organisation Démo\n Fournisseur fictif : Boréal Num  Marc : confirmer les modalités du connecteur interne.\n- Sophie : préparer les exigences de sécurité.\n\nNote\nL'expérience mobile avancée n'a pas été discutée comme livrable distinct pendant cette rencontre.", "sha256": "4474bf0189f6ba64b081c5ee9640186f9950497d37f0610bcdb3db74ae06c6ac", "bytes": 818}, {"id": "M02_Transcript_Architecture_23juillet", "path": "02_Reunions/M02_Transcript_Architecture_23juillet.txt", "file": "M02_Transcript_Architecture_23juillet.txt", "category": "Réunions", "kind": "txt", "text": "TRANSCRIPTION PARTIELLE - ATELIER ARCHITECTURE NOVA\n23 juillet 2026 - 09:00 à 09:47\nParticipants : Élodie Caron (projet), Marc Gervais (architecture), Sophie Lambert (sécurité), Julien Moreau (Boréal)\n\n09:00 Élodie : Bonjour, merci. On a 45 minutes. Avant de commencer, Marc, ton micro coupe un peu.\n09:01 Marc : Oui, je change de casque... c'est mieux?\n09:01 Sophie : Oui.\n09:02 Élodie : L'objectif c'est surtout de fermer la question de la région d'hébergement. Julien nous a envoyé la v1 hier.\n09:03 Julien : Oui, la v1 est basée sur notre landing zone standard, donc East US pour l'instant. Ce n'est pas gravé dans le béton.\n09:05 Marc : Techniquement, le changement vers Canada Central est simple. Il faut juste le savoir maintenant avant qu'on commence à accumuler des ressources.\n09:06 Sophie : Pour moi, ce n'est pas juste une préférence. Les données de production NOVA doivent demeurer au Canada. Je veux qu'on le mette comme décision, pas comme note à revoir.\n09:08 Julien : Aucun problème. On peut basculer le design. Il faudra quelques jours pour recréer les ressources et valider les services disponibles.\n09:10 Élodie : Donc on tranche Canada Central?\n09:10 Marc : Oui.\n09:10 Sophie : Oui.\n09:11 Julien : Oui de notre côté.\n09:12 Élodie : Parfait. Je vais noter la décision et on fera un ADR. La v1 devient donc obsolète pour la localisation des données.\n09:14 Marc : Autre point, l'authentification. On reste SSO seulement, pas de comptes locaux?\n09:15 Sophie : SSO seulement en production.\n09:17 Julien : C'est déjà ce qui est prévu.\n09:20 Élodie : J'ai une question qui n'a rien à voir : quelqu'un sait si la salle 18B est réservée cet après-midi? J'ai un atelier qui vient de changer de local.\n09:21 Marc : Aucune idée.\n09:22 Sophie : Je pense que oui, mais à vérifier.\n09:24 Julien : Sur le stockage, on va utiliser du chiffrement géré côté plateforme. Je vous enverrai les paramètres.\n09:29 Marc : Pour le connecteur interne, j'attends encore le compte de service.\n09:31 Élodie : Est-ce que ça menace le 15 octobre?\n09:31 Marc : Pas à ce stade. C'est tôt. Mais je veux l'avoir avant août.\n09:36 Sophie : J'aimerais aussi qu'on journalise toutes les actions administrateur, surtout consultation et export.\n09:38 Julien : Oui, notre composant a un audit log. On vous montrera ça en validation.\n09:43 Élodie : Donc résumé : Canada Central, SSO uniquement, audit admin à valider. Le reste continue.\n09:46 Marc : Correct.\n09:47 Élodie : Merci tout le monde.", "sha256": "ee3018d95bbd502a2d9fa5ddd66bd1b06bb0f5bb2cee9fdfa43a19ee4676977e", "bytes": 2528}, {"id": "M03_CR_Comite_27aout", "path": "02_Reunions/M03_CR_Comite_27aout.txt", "file": "M03_CR_Comite_27aout.txt", "category": "Réunions", "kind": "txt", "text": "COMITÉ PROJET NOVA - 27 AOÛT 2026\nParticipants : Élodie, Marc, Sophie, Mélissa, Camille, Boréal\n\nRésumé de gestion\n- La migration de l'architecture vers Canada Central est déclarée terminée par Boréal et vérifiée par l'équipe architecture.\n- Le développement fonctionnel avance selon la portée de phase 1.\n- Les tests d'accessibilité ont identifié plusieurs anomalies. Certaines sont déjà corrigées, d'autres restent en traitement.\n- Le connecteur interne demeure un point d'attention mais aucun retard officiel de la date du 15 octobre n'est approuvé à ce moment.\n\nPoints discutés\nMélissa confirme que les anomalies de labels et de contraste ont été corrigées et validées les 15 et 20 août. Elle veut toutefois faire un deuxième passage clavier sur les modales. Sophie rappelle que la journalisation administrateur devra être vérifiée en situation réelle. Camille confirme que le premier lot de migration a produit quelques doublons à investiguer.\n\nAction : Boréal doit fournir une build de stabilisation début septembre.", "sha256": "bc8177355a020cc5fae7775349e8f7ceed7fde9d08b01c3d3127554f2a4daa60", "bytes": 1074}, {"id": "M04_Transcript_Comite_direction_10sept", "path": "02_Reunions/M04_Transcript_Comite_direction_10sept.txt", "file": "M04_Transcript_Comite_direction_10sept.txt", "category": "Réunions", "kind": "txt", "text": "TRANSCRIPTION - COMITÉ DE DIRECTION NOVA\n10 septembre 2026 - 15:00 à 15:42\nParticipants : Élodie Caron, Nicolas Perron, Marc Gervais, Sophie Lambert, Mélissa Gagnon, Olivier Côté, Camille Beaulieu, Julien Moreau (Boréal)\n\n15:00 Élodie : Merci. Je veux qu'on sorte d'ici avec une décision claire sur la date.\n15:02 Julien : Comme écrit mardi, le connecteur nous a coûté plus de temps que prévu. Notre recommandation est de déplacer le lancement du 15 au 22 octobre.\n15:03 Nicolas : On parle d'une semaine complète. Qu'est-ce que ça nous achète exactement?\n15:04 Julien : Stabilisation du connecteur, reprise des tests intégrés et une marge pour corriger les anomalies bloquantes.\n15:06 Marc : Je confirme que le connecteur est le chemin critique en ce moment. Le problème n'est pas juste un écran. Il touche les recherches et la synchronisation.\n15:08 Sophie : De mon côté, je ne veux pas compresser les tests sécurité pour sauver le 15. Le 22 me semble plus réaliste, sous réserve des validations.\n15:10 Mélissa : Même chose pour l'accessibilité. Je peux finir le cycle sans couper de scénarios.\n15:12 Olivier : Pour l'exploitation, une semaine de plus est utile, mais je veux un runbook final au moins quelques jours avant.\n15:15 Camille : La migration de données n'empêche pas le 15 pour l'instant. Le problème de doublons a été corrigé et le rejeu du 9 septembre a été validé sans doublon. DATA-401 est fermé.\n15:17 Nicolas : Est-ce qu'on a un impact contractuel à passer au 22?\n15:18 Élodie : Pas de pénalité identifiée. C'est une date interne de mise en production, le contrat court jusqu'à fin octobre.\n15:20 Julien : Pour nous, le 22 est tenable.\n15:22 Élodie : Je vais formuler la décision. La date cible de mise en production NOVA est déplacée du 15 octobre au **22 octobre 2026**. Est-ce que quelqu'un s'oppose?\n15:23 [silence]\n15:23 Sophie : Non.\n15:23 Marc : Non.\n15:24 Olivier : Non.\n15:24 Nicolas : D'accord.\n15:25 Élodie : Donc **approuvé**. Le 22 devient la date officielle. On doit mettre les plans et communications à jour.\n15:27 Nicolas : Juste pour être sûr, le 22 n'est pas un go automatique. Les critères de sécurité, accessibilité et exploitation restent.\n15:28 Sophie : Absolument.\n15:30 Julien : Compris.\n15:31 Mélissa : J'ai encore un café froid depuis ce matin, donc si quelqu'un connaît un miracle pour ça aussi...\n15:31 Camille : Là on dépasse le mandat du comité.\n15:32 [rires]\n15:34 Élodie : Autre sujet, les optimisations mobiles. Julien, vous avez envoyé une estimation?\n15:35 Julien : Oui, autour de 18 000 $. Ce serait mieux pour l'expérience sur petits écrans.\n15:36 Nicolas : Est-ce que c'est requis pour la phase 1?\n15:37 Élodie : Pas selon la portée actuelle. On va traiter ça séparément, aucune approbation aujourd'hui.\n15:38 Sophie : Merci de ne pas mélanger ça avec les corrections d'accessibilité obligatoires.\n15:40 Élodie : Très bon point. On ferme. Nouvelle date officielle : 22 octobre. Mobile : aucune décision de dépense.\n15:42 Fin.", "sha256": "31a14e3025d62998254ad23b59e34b7e70475425615f30b9f2bde2f6695788d7", "bytes": 3101}, {"id": "M05_CR_Suivi_18sept", "path": "02_Reunions/M05_CR_Suivi_18sept.txt", "file": "M05_CR_Suivi_18sept.txt", "category": "Réunions", "kind": "txt", "text": "SUIVI LIVRAISON - 18 SEPTEMBRE 2026\n\nParticipants : Nicolas Perron, Marc Gervais, Sophie Lambert, Mélissa Gagnon, Olivier Côté, Boréal\n\nFaits saillants\n- INT-101 : le connecteur interne a été validé et fermé le 17 septembre.\n- DATA-401 : la correction d'idempotence a été validée; aucun doublon dans le dernier rejeu.\n- PERF-501 : performance revenue sous la cible de 1 seconde sur les essais de recherche.\n- SEC-210 : Boréal prépare un correctif concernant la journalisation des exports administrateur. La validation sécurité restera requise après livraison.\n- Accessibilité : ACC-301 et ACC-302 sont fermés. Un scénario de navigation clavier sur modal doit encore être vérifié.\n- Exploitation : le runbook n'est pas final.\n\nLe 22 octobre reste la date approuvée. Les participants rappellent toutefois que la date n'annule pas les critères de go-live.", "sha256": "132e8360b2e8c9964a9f40db2dc8376d726b55d4755b990d55868483769c5c8e", "bytes": 877}, {"id": "M06_Transcript_Comite_26sept", "path": "02_Reunions/M06_Transcript_Comite_26sept.txt", "file": "M06_Transcript_Comite_26sept.txt", "category": "Réunions", "kind": "txt", "text": "TRANSCRIPTION PARTIELLE - COMITÉ DE DIRECTION NOVA\n26 septembre 2026 - 10:00 à 10:34\nParticipants : Nicolas Perron, Sophie Lambert, Mélissa Gagnon, Olivier Côté, Julien Moreau (Boréal)\n\n10:00 Nicolas : Je vais être bref. Je veux savoir ce qui peut encore empêcher le 22.\n10:01 Julien : Côté fournisseur, la build est stable. On a aussi livré le fix audit le 19.\n10:02 Sophie : Attention à la formulation. Vous avez livré un fix. Nous n'avons pas encore donné l'acceptation sécurité de SEC-210.\n10:03 Julien : Oui, compris.\n10:05 Mélissa : Il reste ACC-303. La modale ne permet toujours pas d'atteindre Enregistrer au clavier. Pour moi c'est un bloquant d'accessibilité avant production.\n10:07 Olivier : Le runbook est encore incomplet. Il manque le rollback. Je ne donnerai pas mon go exploitation tant que je n'ai pas une procédure exécutable.\n10:09 Nicolas : Donc trois conditions concrètes : validation sécurité de SEC-210, fermeture de =Responsable | E1=Début planifié | F1=Fin planifiée | G1=Note\nA2=P-01 | B2=Cadrage | C2=Terminé | D2=Élodie Caron | E2=2026-07-07 | F2=2026-07-18\nA3=P-02 | B3=Architecture | C3=Terminé | D3=Marc Gervais | E3=2026-07-14 | F3=2026-08-28 | G3=Migration Canada requise\nA4=P-03 | B4=Développement phase 1 | C4=En cours | D4=Boréal Numérique | E4=2026-07-20 | F4=2026-09-30\nA5=P-04 | B5=Tests intégrés | C5=À venir | D5=Mélissa Gagnon | E5=2026-09-21 | F5=2026-10-05\nA6=P-05 | B6=Préparation exploitation | C6=À venir | D6=Olivier Côté | E6=2026-09-28 | F6=2026-10-10\nA7=P-06 | B7=Mise en production | C7=À venir | D7=Nicolas Perron | E7=2026-10-15 | F7=2026-10-15 | G7=Cible de planification", "sha256": "ff7530fdda7bd922cbe7aeda86009a79e4857a6f6d3f9209aa19444096e92aa7", "bytes": 4569}, {"id": "Rapport_Statut_21sept", "path": "04_Documents_projet/Rapport_Statut_21sept.pdf", "file": "Rapport_Statut_21sept.pdf", "category": "Documents projet", "kind": "pdf", "text": "          RAPPORT DE STATUT - NOVA - 21 SEPTEMBRE\n                          2026\n Synthèse\n       Dimension             Statut            Commentaire\n\n       Échéancier            VERT              Cible 22 octobre\n\n       Budget                VERT              Sous le plafond contractuel\n\n       Sécurité              VERT              Correctif SEC-210 livré\n\n       Accessibilité         VERT              Correctifs appliqués\n\n       Exploitation          JAUNE             Runbook à finaliser\n\n Commentaire de gestion\n Le projet est présenté comme globalement sous contrôle. Le rapport a été préparé avant la dernière\n vérification détaillée de certains tickets.\n\nRapport de statut fictif                                                                              Page 1", "sha256": "78fe43e6769c4e8284620282526b5313da427e9f22c1b55aeaf7a31848651537", "bytes": 23729}, {"id": "Registre_Risques_29sept", "path": "04_Documents_projet/Registre_Risques_29sept.xlsx", "file": "Registre_Risques_29sept.xlsx", <script src="updates.js"></script>
<script>/* NOVA Mémoire 360 : application autonome (aucune dépendance). */
(function(){
const D = window.NOVA;
const S = {}; D.sources.forEach(s => S[s.id] = s);
const $ = (q, el=document) => el.querySelector(q);
const $$ = (q, el=document) => Array.from(el.querySelectorAll(q));
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS_KEY = "nova360.updates";

/* ---------- updates (couche datée, baseline intacte) ---------- */
function loadLocalUpdates(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"[]"); }catch(e){ return []; } }
function saveLocalUpdates(arr){ try{ localStorage.setItem(LS_KEY, JSON.stringify(arr)); }catch(e){} }
function allUpdates(){
  const file = (window.NOVA_UPDATES||[]).map(u => Object.assign({_origin:"updates.js"}, u));
  const local = loadLocalUpdates().map(u => Object.assign({_origin:"navigateur (localStorage)"}, u));
  const ids = new Set(file.map(u=>u.id));
  return file.concat(local.filter(u => !ids.has(u.id)));
}
let VIEW = "baseline"; // or "updated"
function updatesFor(ref){
  if (VIEW!=="updated") return [];
  const out = [];
  allUpdates().forEach(u => {
    (u.affected_facts||[]).forEach(f => { if ((f.ref||"").split(/[\s,\/]+/).includes(ref)) out.push({u, f, kind:"fact"}); });
    (u.affected_actions||[]).forEach(a => { if ((a.ref||"").split(/[\s,\/]+/).includes(ref)) out.push({u, f:a, kind:"action"}); });
  });
  return out;
}
function updBadge(ref){
  const ups = updatesFor(ref);
  if (!ups.length) return "";
  return ups.map(x => `<span class="badge-upd" title="${esc(x.u.summary||"")}">↻ ${esc(x.u.id)}</span>`).join("");
}
function updBlocks(ref){
  const ups = updatesFor(ref);
  if (!ups.length) return "";
  return ups.map(x => {
    const f = x.f;
    const body = x.kind==="fact"
      ? `<div class="diff"><span class="before">${esc(f.before||"")}</span> → <span class="after">${esc(f.after||"")}</span></div>`
      : `<div><b>Changement :</b> ${esc(f.change||"")}</div>`;
    return `<div class="upd-box"><h3>Mise à jour ${esc(x.u.id)} (${esc(x.u.event_date||x.u.received_at||"")})</h3>${body}<div class="small">Preuve : ${esc(f.evidence||"")} · <i>${esc(x.u.summary||"")}</i></div><div class="small muted">Le texte du baseline, au-dessus, est gardé tel quel.</div></div>`;
  }).join("");
}

/* ---------- evidence chips & source drawer ---------- */
function ev(src, a, b, label){
  const s = S[src]; if (!s) return `<span class="ev" title="source inconnue">${esc(src)}</span>`;
  const isImg = !!s.image;
  const lab = label || (s.file + (a? (isImg? "" : ` · l. ${a}${b&&b!==a?" à "+b:""}`) : ""));
  return `<a class="ev${isImg?" img":""}" href="#src=${esc(src)}&l=${a||""}-${b||""}" data-src="${esc(src)}" data-a="${a||""}" data-b="${b||""}" title="${esc(s.path)}">${esc(lab)}</a>`;
}
function evList(arr){ return (arr||[]).map(e => ev(e[0], e[1], e[2], e[3]? `${S[e[0]]?S[e[0]].file:e[0]} · ${e[3]}` : null)).join(" "); }
function openSource(id, a, b){
  const s = S[id]; if (!s) return;
  const meta = D.source_meta[id] || {};
  const dr = $("#drawer");
  $("#drawer .dh h3").textContent = s.path;
  let m = `<b>${esc(s.category)}</b> · ${esc(s.kind.toUpperCase())} · ${s.bytes} octets · lecture : <b class="role-${(meta.role||"").slice(0,4)}">${esc(meta.role||"")}</b><br>Qui décide, comment lire : ${esc(meta.authority||"non précisé")}`;
  if (s.date) m += `<br>Courriel de ${esc(s.from||"")}, le ${esc(s.date)}, objet « ${esc(s.subject||"")} »`;
  if (s.attachments && s.attachments.length) m += `<br>Pièces jointes : ` + s.attachments.map(x => `${esc(x.name)}${x.same_as&&x.same_as.length? " = même fichier que " + x.same_as.map(esc).join(", ") + " (ne compte pas comme une deuxième preuve)" : ""}`).join("; ");
  if (s.duplicate_of) m += `<br><b>Copie exacte de :</b> ${s.duplicate_of.map(esc).join(", ")}`;
  m += `<br><a href="corpus/Projet360_NOVA_ETUDIANTS/${encodeURI(s.path)}" target="_blank">Ouvrir le fichier original</a> · SHA-256 ${s.sha256.slice(0,12)}…`;
  $("#drawer .meta").innerHTML = m;
  let body = "";
  if (s.image) body += `<img src="${s.image}" alt="${esc(s.file)}"><div class="small muted">Transcription vérifiée (OCR corrigé à la main) :</div>`;
  else if (s.kind==="pdf") body += `<div class="small muted">Texte extrait du PDF (page 1). La mise en page est approximative. Ouvrez l'original pour voir la présentation.</div>`;
  else if (s.kind==="xlsx") body += `<div class="small muted">Cellules non vides, une ligne par rangée (A1=…). La ligne N du tableur est la ligne N+1 ci-dessous.</div>`;
  const lines = (s.text||"").split("\n");
  body += `<pre class="src">` + lines.map((l,i) => { const n=i+1; const hl = a && n>=a && n<=(b||a); return `<span class="ln${hl?" hl":""}" id="L${n}"><span class="n">${n}</span>${esc(l)||" "}</span>`; }).join("") + `</pre>`;
  $("#drawer .body").innerHTML = body;
  dr.classList.add("open");
  if (a) setTimeout(() => { const el = $("#drawer #L"+a); if (el) el.scrollIntoView({block:"center"}); }, 30);
}
document.addEventListener("click", e => {
  const chip = e.target.closest("a.ev"); if (chip){ e.preventDefault(); openSource(chip.dataset.src, +chip.dataset.a||0, +chip.dataset.b||0); return; }
  const srow = e.target.closest("[data-open-src]"); if (srow){ openSource(srow.dataset.openSrc, 0, 0); }
});
$("#drawer .dh button").addEventListener("click", () => $("#drawer").classList.remove("open"));
document.addEventListener("keydown", e => { if (e.key==="Escape") $("#drawer").classList.remove("open"); });

/* ---------- tabs & view ---------- */
function showTab(name){
  $$("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab===name));
  $$("section.tab").forEach(s => s.classList.toggle("on", s.id==="tab-"+name));
  location.hash = "#tab=" + name;
}
$$("nav.tabs button").forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));
$$(".viewsel button").forEach(b => b.addEventListener("click", () => { VIEW = b.dataset.view; $$(".viewsel button").forEach(x => x.classList.toggle("on", x===b)); renderAll(); }));

/* ---------- renderers ---------- */
function renderBrief(){
  const B = D.brief; let h = "";
  if (VIEW==="updated"){
    const ups = allUpdates();
    if (ups.length){
      h += `<div class="upd-box"><h3>État mis à jour : ${ups.length} événement(s) ajouté(s) par-dessus le baseline du 30 sept.</h3>` + ups.map(u => `<p><b>${esc(u.id)}</b> (${esc(u.event_date||u.received_at||"")}) : ${esc(u.summary||"")}<br><b>Statut du problème :</b> ${esc(u.problem_status||"non précisé")}<br><b>Décision antérieure (toujours en vigueur, sauf mention) :</b> ${esc(u.prior_decision||"non précisé")}<br><b>Nouvelle proposition (non approuvée) :</b> ${esc(u.new_proposal||"aucune")}<br><b>Ce qui ne change pas :</b> ${esc(u.unchanged||"non précisé")}<br><span class="small">Preuve : ${esc((u.source||{}).file||"")} · ${esc((u.source||{}).loc||"")}</span></p>`).join("") + `</div>`;
    } else h += `<div class="upd-box"><h3>Vue « Mis à jour »</h3><p>Aucun événement ajouté pour l'instant : l'état mis à jour est le même que le baseline. Utilisez l'onglet « Mise à jour » pour saisir la nouvelle information.</p></div>`;
  }
  h += `<div class="brief"><h2>${esc(B.title)}</h2><div class="asof">${esc(B.asof)}</div>`;
  B.sections.forEach(sec => { h += `<h4>${esc(sec.h)}</h4>` + sec.items.map(p => `<p>${esc(p)}</p>`).join(""); });

function search(qs){

  if (q.length < 2){ box.innerHTML = `<h2>Recherche</h2><p class="muted">Tapez au moins deux lettres.</p>`; return; }

  const mark = s => esc(s).replace(re, m => `<mark>${m}</mark>`);
  let hits = [];
  D.questions.forEach(x => { const t = x.question+" "+x.answer+" "+x.nuance.join(" "); if (t.toLowerCase().includes(q)) hits.push(`<div class="hit"><span class="tag">question</span> <a href="#tab=questions" onclick="document.querySelector('[data-tab=questions]').click();setTimeout(()=>location.hash='#${x.id}',50)"><b>${x.id}</b> ${esc(x.question)}</a><br>${mark(snippet(t,q))}</div>`); });
  D.decisions.forEach(x => { const t = x.title+" "+x.why+" "+x.conditions; if (t.toLowerCase().includes(q)) hits.push(`<div class="hit"><span class="tag decision">décision</span> <b>${x.id}</b> ${mark(x.title)}</div>`); });
  D.contradictions.forEach(x => { const t = x.title+" "+x.resolution; if (t.toLowerCase().includes(q)) hits.push(`<div class="hit"><span class="tag contradiction">contradiction</span> <b>${x.id}</b> ${mark(x.title)}<br>${mark(snippet(x.resolution,q))}</div>`); });
  D.actions.forEach(x => { const t = x.title+" "+x.owner+" "+x.note; if (t.toLowerCase().includes(q)) hits.push(`<div class="hit"><span class="tag">action</span> <b>${x.id}</b> ${mark(x.title)} · ${esc(x.owner)} · ${esc(x.due)}</div>`); });
  D.timeline.forEach(x => { const t = x.title+" "+x.detail; if (t.toLowerCase().includes(q)) hits.push(`<div class="hit"><span class="tag ${x.type==="décision"?"decision":x.type}">${x.type}</span> <span class="date">${x.date}</span> ${mark(x.title)} ${x.src?ev(x.src,x.lines[0],x.lines[1]):""}</div>`); });
  let shits = [];
  D.sources.forEach(s => { const lines = (s.text||"").split("\n"); lines.forEach((l,i) => { if (l.toLowerCase().includes(q)) shits.push(`<div class="hit">${ev(s.id, i+1, i+1)} ${mark(l.trim().slice(0,220))}</div>`); }); });
  box.innerHTML = `<h2>Recherche : « ${esc(qs)} »</h2><h3>Dans la mémoire (${hits.length} résultats)</h3><div class="search-res">${hits.join("")||"<p class='muted'>Aucun résultat.</p>"}</div><h3>Dans le texte complet des sources (${shits.length} lignes)</h3><div class="search-res">${shits.slice(0,400).join("")||"<p class='muted'>Aucun résultat.</p>"}${shits.length>400?"<p class='muted'>… liste coupée, précisez la recherche.</p>":""}</div>`;
}
function snippet(t, q){ const i = t.toLowerCase().indexOf(q); const a = Math.max(0, i-90); return (a>0?"…":"") + t.slice(a, i+160) + "…"; }

/* ---------- analyse par mots-clés ---------- */
function analyse(text){
  const t = norm(text);

  let event_date = "";
  if (dm){ const mkey = norm(dm[2]).slice(0,4).replace(/\.$/,""); const mm = months[mkey] || months[mkey.slice(0,3)] || ""; if (mm) event_date = `${dm[3]}-${mm}-${String(dm[1]).padStart(2,"0")}`; }

  const new_actions = [];

  const R = retrieve(question);
  const brief = D.brief.sections.map(sec => sec.items.map(it => `- [${sec.h}] ${it}`).join("\n")).join("\n");
  const ctx = ["FAITS CLÉS VÉRIFIÉS (baseline au " + D.reference_date_label + "). Ils l'emportent sur tout extrait plus ancien ou écrit par quelqu'un qui n'a pas le pouvoir de décider :", brief, "\nEXTRAITS DES FICHIERS (numéro de ligne devant chaque ligne; la note [lecture : …] dit si la source est ancienne, périmée ou sans pouvoir) :", ...R.passages.map(p => `### ${p.path} (lignes ${p.from} à ${p.to}) [lecture : ${p.role}. ${p.authority}]\n${p.text}`), "\nENTRÉES DE LA MÉMOIRE VÉRIFIÉE :", ...R.memory.map(m => m.text)].join("\n\n");
  const system = "Tu réponds à des questions sur le projet NOVA en t'appuyant UNIQUEMENT sur les faits clés vérifiés et les extraits fournis. Tu réponds par un objet JSON : {\"reponse\": \"texte en français simple, phrases courtes\", \"sources\": [{\"fichier\": \"chemin exact tel qu'écrit dans les extraits, ou le code court cité dans les faits clés (E09, M04, M06, ADR-007…)\", \"ligne\": numéro}], \"incertitude\": \"ce que les extraits ne disent pas\"}.\n" + RULES + "\n7. Pour une question large (risques, reprise du projet, décisions, état du projet), pars des FAITS CLÉS VÉRIFIÉS, puis complète avec les extraits. Un problème fermé n'est plus un risque. Un document ancien (charte, plan v2, courriel de juillet) ne donne pas l'état actuel.\nSi rien ne permet de répondre, écris-le clairement dans « reponse ». Date de référence : " + D.reference_date_label + ".";
  const user = `QUESTION : ${question}\n\n${ctx}`;
  const txt = await callModel(system, user, true);
  const j = parseJson(txt);
  return {j, R};
}

/* ---------- interface ---------- */
function settingsHtml(){
  const c = cfg();
  return `<details class="iacfg"><summary>Réglages du modèle local</summary><div class="grid2" style="margin-top:6px">
    <div><label>Type de serveur</label><select class="ia_kind"><option value="ollama" ${c.kind==="ollama"?"selected":""}>Ollama (http://localhost:11434)</option><option value="openai" ${c.kind==="openai"?"selected":""}>Compatible OpenAI : LM Studio, llama.cpp (http://localhost:1234)</option></select></div>
    <div><label>Adresse</label><input class="ia_url" value="${esc(c.url)}"></div>
    <div><label>Modèle</label><input class="ia_model" value="${esc(c.model)}" placeholder="qwen2.5:7b, llama3.1:8b, mistral…"></div>
    <div><label>Taille de contexte (Ollama)</label><input class="ia_ctx" value="${esc(c.ctx)}"></div></div>
    <button type="button" class="btn sec ia_save">Enregistrer</button> <button type="button" class="btn sec ia_test">Tester la connexion</button> <span class="ia_status small muted"></span>
    <p class="small muted">Tout reste sur cet ordinateur : aucune donnée ne sort. <b>Si le test échoue (« Load failed », « Failed to fetch »)</b> : la page est sans doute ouverte en file:// (double-clic), ce que Safari et Ollama bloquent. Ouvrez-la plutôt avec <code>Ouvrir_avec_serveur_local.command</code> (à côté de index.html) : elle s'affiche sur http://localhost:8765 et Ollama l'accepte sans réglage. Autre solution : quitter l'application Ollama de la barre de menu, puis dans un terminal <code>OLLAMA_ORIGINS="*" ollama serve</code>. Si rien ne répond, la fiche se remplit avec l'aide rapide : le reste du rendu ne dépend pas du modèle.</p></details>`;
}
function wireSettings(root){
  $(".ia_save", root).onclick = () => { saveCfg({kind:$(".ia_kind",root).value, url:$(".ia_url",root).value.trim(), model:$(".ia_model",root).value.trim(), ctx:+$(".ia_ctx",root).value||12288}); $(".ia_status",root).textContent = "Réglages enregistrés."; };
  $(".ia_test", root).onclick = async () => { saveCfg({kind:$(".ia_kind",root).value, url:$(".ia_url",root).value.trim(), model:$(".ia_model",root).value.trim(), ctx:+$(".ia_ctx",root).value||12288}); $(".ia_status",root).textContent = "Test…"; const p = await ping(); $(".ia_status",root).textContent = p.ok ? ("Connecté. Modèles disponibles : " + (p.names.join(", ")||"aucun")) : ("Pas de réponse (" + p.error + "). Vérifiez que le serveur tourne et que OLLAMA_ORIGINS est réglé."); };
}
function renderAssistantTab(){
  const el = $("#tab-assistant"); if (!el) return;
  el.innerHTML = `<h2>Assistant IA local (optionnel)</h2>
  <div class="card"><p><b>Sur une machine sans GPU, comptez 2 à 3 minutes par réponse : préparez vos questions avant la démonstration.</b> Posez une question en langage naturel. L'assistant cherche d'abord les passages pertinents dans les 64 fichiers et dans la mémoire vérifiée, puis un modèle qui tourne <b>sur cet ordinateur</b> rédige la réponse en citant fichier et ligne. Les citations sont cliquables : vérifiez toujours la source. Sans modèle local, utilisez la barre de recherche et l'onglet Questions.</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><input id="ia_q" style="flex:1;min-width:260px;font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:5px" placeholder="ex. Quelle est la date de livraison prévue et pourquoi? Quels engagements ne sont pas terminés?"><button class="btn" id="ia_ask">Demander</button></div>
  <div id="ia_out" style="margin-top:10px"></div>
  ${settingsHtml()}</div>`;
  wireSettings(el);
  const run = async () => {
    const q = $("#ia_q", el).value.trim(); if (!q) return;
    const out = $("#ia_out", el); out.innerHTML = `<p class="muted">Recherche des passages, puis appel du modèle local… (30 s à 3 minutes sans GPU)</p>`;
    try {
      const {j, R} = await answer(q);
      const chips = (j.sources||[]).map(s => { const f = String(s.fichier||"").trim(); const src = D.sources.find(x => x.path===f || x.file===f || x.id===f) || D.sources.find(x => f && (x.id.toLowerCase().startsWith(f.toLowerCase()) || x.file.toLowerCase().startsWith(f.toLowerCase()))); const ln = +s.ligne||0; return src ? `<a class="ev" href="#src=${esc(src.id)}&l=${ln}-${ln}" data-src="${esc(src.id)}" data-a="${ln}" data-b="${ln}">${esc(src.file)}${ln?` · l. ${ln}`:""}</a>` : `<span class="ev" title="fichier non reconnu">${esc(s.fichier||"?")}</span>`; }).join(" ");
      out.innerHTML = `<div class="upd-box"><h3>Réponse (brouillon du modèle local, à vérifier)</h3><p>${esc(j.reponse||"")}</p><p><b>Sources citées :</b> ${chips||"<span class='muted'>aucune</span>"}</p><p class="small"><b>Ce que les extraits ne disent pas :</b> ${esc(j.incertitude||"")}</p></div>
      <details><summary>Passages fournis au modèle (${R.passages.length} extraits, ${R.memory.length} entrées de mémoire)</summary>${R.passages.map(p => `<div class="hit"><a class="ev" href="#" data-src="${esc(p.id)}" data-a="${p.from}" data-b="${p.to}">${esc(p.path)} · l. ${p.from} à ${p.to}</a></div>`).join("")}</details>`;
    } catch(e){ out.innerHTML = `<p class="small" style="color:var(--bad)">Impossible d'obtenir une réponse : ${esc(e.message)}. Le modèle local ne répond pas, ou le format est inattendu. Vous pouvez utiliser la recherche (barre en haut) et l'onglet Questions.</p>`; }
  };
  $("#ia_ask", el).onclick = run; $("#ia_q", el).addEventListener("keydown", e => { if (e.key==="Enter") run(); });
}
function renderPrefill(){
  const form = $("#updform"); if (!form || $("#ia_prefill")) return;
  const box = document.createElement("div"); box.className = "card"; box.id = "ia_prefill";
  box.innerHTML = `<h3>Brouillon par le modèle local (optionnel, lent)</h3><p class="small">Utilisez d'abord l'aide rapide ci-dessus. Le modèle local peut ensuite proposer un brouillon, mais il met plusieurs minutes sans GPU et il se trompe souvent sur qui a le pouvoir de décider (il peut « fermer » un ticket que personne n'a validé). <b>Vérifiez chaque ligne avant d'enregistrer.</b></p>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input type="file" id="ia_file" accept=".eml,.txt,.md,.csv"> <input id="ia_fname" placeholder="nom du fichier (ex. 09_Evenement/E13.eml)" style="flex:1;min-width:220px;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:5px"></div>
  <textarea id="ia_text" style="width:100%;min-height:140px;font:inherit;font-size:13px;margin-top:8px;padding:6px 8px;border:1px solid var(--line);border-radius:5px" placeholder="Texte du document reçu…"></textarea>
  <button type="button" class="btn" id="ia_go">Proposer un brouillon</button> <span id="ia_pstatus" class="small muted"></span>
  <div id="ia_flags"></div>${settingsHtml()}`;
  form.parentNode.insertBefore(box, form);
  wireSettings(box);
  $("#ia_file", box).onchange = e => { const f = e.target.files[0]; if (!f) return; $("#ia_fname", box).value = "09_Evenement/" + f.name; const rd = new FileReader(); rd.onload = () => { let t = rd.result; if (/^From:|^Subject:/m.test(t)) { /* .eml : garder en-têtes utiles + corps */ t = t.replace(/\r/g,""); } $("#ia_text", box).value = t; }; rd.readAsText(f, "utf-8"); };
  $("#ia_go", box).onclick = async () => {
    const text = $("#ia_text", box).value.trim(); if (!text){ $("#ia_pstatus", box).textContent = "Collez d'abord le texte."; return; }
    $("#ia_pstatus", box).textContent = "Appel du modèle local… (1 à 5 minutes sans GPU; la première fois, le modèle doit se charger)"; $("#ia_flags", box).innerHTML = "";
    try {
      const d = await draftUpdate(text, $("#ia_fname", box).value.trim());
      fillForm(d);
      const flags = validateDraft(d, text);
      $("#ia_pstatus", box).textContent = "Brouillon placé dans le formulaire. Vérifiez, corrigez, puis enregistrez.";
      $("#ia_flags", box).innerHTML = `<div class="upd-box"><h3>Brouillon IA : à vérifier avant d'enregistrer</h3>${flags.length ? `<p><b>Points à contrôler (${flags.length}) :</b></p><ul class="tight">${flags.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>` : `<p>Aucun problème de forme détecté. Relisez quand même le fond : qui décide, livré ou validé, proposition ou décision.</p>`}</div>`;
      form.scrollIntoView({block:"start"});
    } catch(e){ $("#ia_pstatus", box).textContent = ""; $("#ia_flags", box).innerHTML = `<p class="small" style="color:var(--bad)">Pas de brouillon : ${esc(e.message)}. Remplissez la fiche à la main (les cinq champs essentiels : résumé, statut du problème, décision antérieure, nouvelle proposition, ce qui ne change pas).</p>`; }
  };
}
// hooks: the main app re-renders tabs; observe and (re)inject
renderAssistantTab();
const obs = new MutationObserver(() => { if ($("#updform") && !$("#ia_prefill")) renderPrefill(); if ($("#tab-assistant") && !$("#ia_q")) renderAssistantTab(); });
obs.observe(document.querySelector("main"), {childList:true, subtree:true});
renderPrefill();
window.NOVA_IA = {retrieve, answer, draftUpdate, validateDraft, cfg};
})();
</script>
